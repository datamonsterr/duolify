version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - noctx
  exclusions:
    generated: strict
output:
  # Repo-root relative paths so CI annotations attach to the right file.
  path-prefix: services/api
formatters:
  enable:
    - gofmt
