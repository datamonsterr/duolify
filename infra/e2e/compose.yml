# Full-stack browser e2e overlay (openspec/changes/fullstack-flow-e2e). Merged on top
# of the production-shaped infra/deploy/compose.yml by infra/e2e/stack.sh only; it is
# never used for a real deployment. It changes test plumbing, not product behaviour:
# sign-in throttles are raised so repeated runs from one host IP are not locked out.
# Lesson generation and the lesson test follow infra/deploy/compose.yml (on by default);
# export E2E_LESSON_TEST_TRACER_ENABLED=false to run with them off.
# Sign-in codes are read from the API's DUOLIFY_ENV=development log (LogMailer), so no
# mail sink container is needed.
# PRICING_OWNER_ID is this throwaway stack's own test owner (a UUID generated by stack.sh
# init); `stack.sh approve-pricing` acts as that owner through the unmodified admin flow.
services:
  api:
    environment:
      LESSON_TEST_TRACER_ENABLED: ${E2E_LESSON_TEST_TRACER_ENABLED:-true}
      PRICING_OWNER_ID: ${E2E_PRICING_OWNER_ID:-}
      # The pricing activator needs a mapping verifier; this is the development-only fake
      # (refused outside DUOLIFY_ENV development/test by pricing.VerifierFromEnvironment).
      ALLOW_FAKE_PRICING_VERIFIER: "true"
      AUTH_CODE_REQUESTS_PER_IP_PER_HOUR: "100000"
      AUTH_CODE_REQUESTS_PER_EMAIL_PER_HOUR: "100000"
      AUTH_CODE_DELIVERIES_PER_EMAIL_PER_HOUR: "100000"
      AUTH_CODE_VERIFICATIONS_PER_IP_PER_HOUR: "100000"
  worker:
    environment:
      LESSON_TEST_TRACER_ENABLED: ${E2E_LESSON_TEST_TRACER_ENABLED:-true}
      PRICING_OWNER_ID: ${E2E_PRICING_OWNER_ID:-}
