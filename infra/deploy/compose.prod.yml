# Production overlay (ADR 0014, Hetzner hel1) on top of compose.yml:
#   docker compose -f compose.yml -f compose.prod.yml --env-file .env up -d
# (selfhost.sh does this when SELFHOST_OVERLAY points at this file.)
#
# Adds: API x2, Postgres 18 WAL archiving (7-day PITR, encrypted, shipped to the backup bucket
# off the VM, in Cloudflare R2), the nightly DR copy, node-exporter + Prometheus alerts. Object storage comes
# from env: S3_* and BACKUP_S3_* (Cloudflare R2 in production: endpoint https://<account>.r2.cloudflarestorage.com, region auto).
# RustFS is local-only: set COMPOSE_PROFILES=local-s3 (CI does) to run it, its initializers and
# the scoped identities; otherwise those services do not start.
x-walship-env: &walship-env
  PGHOST: postgres
  PGUSER: duolify
  PGPASSWORD: ${POSTGRES_PASSWORD:?run selfhost.sh init}
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://objectstore:9000}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-duolify-backups}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-duolify-backup-writer}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-duolify}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-duolify-app}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?run selfhost.sh init}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}

# Object-store endpoints from env instead of the local RustFS defaults.
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-duolify}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-duolify-app}
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://objectstore:9000}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-duolify-backups}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-duolify-backup-writer}
  # none on Cloudflare R2 (no object versioning): protected asset copies are then pinned by checksum alone.
  BACKUP_S3_VERSIONING: ${BACKUP_S3_VERSIONING:-enabled}

services:
  objectstore: {profiles: [local-s3]}

  # Host-local Caddy site settings and certificates (git-ignored *.caddy, *.pem, *.key); see Caddyfile.
  proxy:
    volumes: [./site.d:/etc/caddy/site.d:ro]
    deploy: {resources: {reservations: {memory: 32M}}}
  s3-init: {profiles: [local-s3]}
  backup-init: {profiles: [local-s3]}

  # The engine is reachable only on the private network: never add `ports` here.
  engine:
    labels: {duolify.exposure: private}
    deploy: {resources: {reservations: {memory: 96M}}}

  redis:
    deploy: {resources: {reservations: {memory: 32M}}}

  # stop_grace_period (120 s, set in compose.yml for api, worker and engine) must exceed the 90 s drain of the API
  # (API_DRAIN_TIMEOUT), worker (WORKER_DRAIN_TIMEOUT) and engine (ENGINE_DRAIN_TIMEOUT_SECS): docker stop sends
  # SIGTERM, the process stops accepting and finishes in-flight work, and only then exits. deploy-plan.sh enforces it.
  api:
    environment:
      <<: *s3-env
      DB_POOL_MAX_CONNS: ${API_DB_POOL_MAX_CONNS:-10}
      DB_POOL_MIN_CONNS: ${API_DB_POOL_MIN_CONNS:-2}
    depends_on:
      backup-init: {condition: service_completed_successfully, required: false}
    # Two replicas: one can crash or be OOM-killed while the other serves (the rolling restart in
    # deploy.sh is zero-downtime with one too). 2 x 384 M, 3 x 384 M for a moment during a roll.
    deploy: {replicas: 2, resources: {limits: {cpus: "1", memory: 384M}, reservations: {memory: 128M}}}

  worker:
    environment:
      <<: *s3-env
      DB_POOL_MAX_CONNS: ${WORKER_DB_POOL_MAX_CONNS:-16}
      DB_POOL_MIN_CONNS: ${WORKER_DB_POOL_MIN_CONNS:-4}
    depends_on:
      backup-init: {condition: service_completed_successfully, required: false}
    deploy: {resources: {reservations: {memory: 128M}}}

  # Direct connections only (session advisory locks, River): no pooler in front of Postgres.
  postgres:
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      # Durable, overwrite-safe copy into the spool (fsync file + directory); walship encrypts,
      # uploads and then removes the file.
      - archive_command=sh /usr/local/bin/archive-wal.sh %p %f
      # Sized for the 4 GB VM (docs/infra/hardening.md, 'Sizing'); the container limit is POSTGRES_MEMORY.
      - -c
      - max_connections=60
      - -c
      - superuser_reserved_connections=3
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - huge_pages=off
      - -c
      - wal_compression=lz4
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - jit=off
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.1
      - -c
      - autovacuum_analyze_scale_factor=0.05
      - -c
      - autovacuum_vacuum_cost_limit=1000
      - -c
      - idle_in_transaction_session_timeout=300s
      - -c
      - log_min_duration_statement=500ms
      - -c
      - track_io_timing=on
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
      - source: archive_wal
        target: /usr/local/bin/archive-wal.sh
    volumes: [wal-spool:/wal-spool]
    depends_on:
      spool-init: {condition: service_completed_successfully}
    deploy: {resources: {limits: {memory: "${POSTGRES_MEMORY:-1280M}"}, reservations: {memory: 768M}}}

  # One-shot: let the postgres user (uid 999) write into the spool volume.
  spool-init:
    image: ${IMAGE_REGISTRY:-duolify}/walship:${IMAGE_TAG:-local}
    build: {context: ./walship}
    entrypoint: [chown, "999:999", /wal-spool]
    volumes: [wal-spool:/wal-spool]
    restart: "no"

  # WAL shipping, nightly base backup (7-day PITR window comes from the bucket lifecycle on wal/ and
  # base/: `mise run infra:backup-lifecycle`, checked by `infra:backup-preflight`) and nightly DR copy of the application bucket. WALSHIP_JOBS must keep all three.
  walship:
    image: ${IMAGE_REGISTRY:-duolify}/walship:${IMAGE_TAG:-local}
    build: {context: ./walship}
    environment:
      <<: *walship-env
      WALSHIP_JOBS: ship,base,dr-copy
    volumes: [wal-spool:/wal-spool, walship-metrics:/metrics]
    depends_on:
      postgres: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully, required: false}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    deploy: {resources: {limits: {cpus: "1", memory: 256M}, reservations: {memory: 64M}}}

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/metrics
    volumes: ["/:/host:ro,rslave", "walship-metrics:/metrics:ro"]
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.25", memory: 48M}, reservations: {memory: 16M}}}

  prometheus:
    image: prom/prometheus:v3.8.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ../observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      node-exporter: {condition: service_started}
    restart: unless-stopped
    deploy: {resources: {limits: {cpus: "0.5", memory: 192M}, reservations: {memory: 96M}}}

configs:
  archive_wal:
    file: ./walship/archive-wal.sh
  pg_hba:
    content: |
      local all all trust
      host all all all scram-sha-256
      host replication all all scram-sha-256

volumes:
  wal-spool:
  walship-metrics:
  prometheus-data:
