# Self-hosted, production-shaped Duolify stack (ADR 0014). Self-contained: it
# does not extend the development docker-compose.yml. Drive it through
# `infra/deploy/selfhost.sh` (or the `mise run infra:selfhost-*` tasks), which
# pins the project name and env file. See docs/infra/selfhost.md.
#
# Only `proxy` publishes ports. Every other service, including the engine, is
# reachable only on the private Compose networks.
name: duolify-selfhost

x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-app-env: &app-env
  DUOLIFY_ENV: ${DUOLIFY_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://duolify:${POSTGRES_PASSWORD:?run selfhost.sh init}@postgres:5432/duolify?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  ENGINE_ADDR: http://engine:50051
  JWT_SECRET: ${JWT_SECRET:?run selfhost.sh init}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
  AUTH_TRUSTED_PROXY_HOPS: "1"
  # Comma-separated browser origins for CORS and cookie-mode web sign-in; defaults to the web origin.
  API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}}
  # Clerk web sign-in: all empty = off; the secret and publishable key are set together, and
  # CLERK_AUTHORIZED_PARTIES lists the web origin(s) allowed to mint tokens.
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
  CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
  CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
  # Sign-in code limits per hour; empty keeps the code defaults (20 / 3 / 10 / 60).
  AUTH_CODE_REQUESTS_PER_IP_PER_HOUR: ${AUTH_CODE_REQUESTS_PER_IP_PER_HOUR:-}
  AUTH_CODE_REQUESTS_PER_EMAIL_PER_HOUR: ${AUTH_CODE_REQUESTS_PER_EMAIL_PER_HOUR:-}
  AUTH_CODE_DELIVERIES_PER_EMAIL_PER_HOUR: ${AUTH_CODE_DELIVERIES_PER_EMAIL_PER_HOUR:-}
  AUTH_CODE_VERIFICATIONS_PER_IP_PER_HOUR: ${AUTH_CODE_VERIFICATIONS_PER_IP_PER_HOUR:-}
  # Lesson test tuning (code defaults) and the SSE heartbeat (empty = 15 s).
  LESSON_TEST_MIN_GAP: ${LESSON_TEST_MIN_GAP:-2}
  LESSON_TEST_MAX_VARIANTS_PER_TOPIC: ${LESSON_TEST_MAX_VARIANTS_PER_TOPIC:-3}
  LESSON_TEST_MAX_VARIANTS_PER_TEST: ${LESSON_TEST_MAX_VARIANTS_PER_TEST:-12}
  LESSON_TEST_SESSION_TTL: ${LESSON_TEST_SESSION_TTL:-7d}
  SSE_HEARTBEAT_INTERVAL: ${SSE_HEARTBEAT_INTERVAL:-}
  # Database pool (store.PoolConfigFromEnv); api and worker override the sizes in compose.prod.yml.
  DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-10}
  DB_POOL_MIN_CONNS: ${DB_POOL_MIN_CONNS:-2}
  DB_POOL_MAX_CONN_LIFETIME: ${DB_POOL_MAX_CONN_LIFETIME:-30m}
  DB_POOL_MAX_CONN_IDLE_TIME: ${DB_POOL_MAX_CONN_IDLE_TIME:-5m}
  DB_POOL_HEALTH_CHECK_PERIOD: ${DB_POOL_HEALTH_CHECK_PERIOD:-1m}
  S3_ENDPOINT: http://objectstore:9000
  S3_BUCKET: duolify
  S3_REGION: us-east-1
  S3_VERSIONING: ${S3_VERSIONING:-enabled}
  S3_ACCESS_KEY_ID: duolify-app
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
  LESSON_ASSET_ORIGIN: ${LESSON_ASSET_ORIGIN:-http://localhost:9000}
  SHARING_PUBLIC_DOMAIN: ${SHARING_PUBLIC_DOMAIN:-localhost}
  PUSH_ADAPTER: disabled
  NARRATION_ENABLED: ${NARRATION_ENABLED:-false}
  # The live-synthesis budget is read only when NARRATION_LIVE_ENABLED=true (ADR 0015: Starter plan).
  NARRATION_LIVE_ENABLED: ${NARRATION_LIVE_ENABLED:-false}
  NARRATION_MONTHLY_CHAR_LIMIT: ${NARRATION_MONTHLY_CHAR_LIMIT:-40000}
  NARRATION_BUDGET_STOP_PERCENT: ${NARRATION_BUDGET_STOP_PERCENT:-95}
  NARRATION_CYCLE_START_DAY: ${NARRATION_CYCLE_START_DAY:-1}
  NARRATION_RETENTION_DAYS: ${NARRATION_RETENTION_DAYS:-30}
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
  LESSON_TEST_TRACER_ENABLED: ${LESSON_TEST_TRACER_ENABLED:-true}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
  ANALYTICS_OPT_OUT: ${ANALYTICS_OPT_OUT:-true}

x-backup-writer: &backup-writer
  BACKUP_S3_ENDPOINT: http://objectstore:9000
  BACKUP_S3_REGION: us-east-1
  BACKUP_S3_BUCKET: duolify-backups
  BACKUP_S3_ACCESS_KEY_ID: duolify-backup-writer
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}

x-api-image: &api-image
  image: ${API_IMAGE:-${IMAGE_REGISTRY:-duolify}/api:${IMAGE_TAG:-local}}
  build: {context: ../../services/api, target: api}

services:
  proxy:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-duolify}/web:${IMAGE_TAG:-local}}
    build: {context: ../.., dockerfile: apps/client/Dockerfile, target: web}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Origins of the web Content-Security-Policy (security-headers.caddy). API_ORIGIN stays empty while the
      # client calls the API on its own origin. proxy-entrypoint.sh derives the Clerk origin from the key.
      LESSON_ASSET_ORIGIN: ${LESSON_ASSET_ORIGIN:-http://localhost:9000}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_ASSETS_HOST: ${POSTHOG_ASSETS_HOST:-https://us-assets.i.posthog.com}
      API_ORIGIN: ${API_ORIGIN:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_FAPI_ORIGIN: ${CLERK_FAPI_ORIGIN:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes: [caddy-data:/data, caddy-config:/config]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      <<: *health
      # Unpublished listener; works with or without automatic HTTPS.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "0.5", memory: 96M}}}

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: duolify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run selfhost.sh init}
      POSTGRES_DB: duolify
    volumes: [postgres-data:/var/lib/postgresql]
    shm_size: 256m
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'pg_isready -U duolify -d duolify']
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "2", memory: "${POSTGRES_MEMORY:-1G}"}}}

  redis:
    image: redis:8.4
    # A pure cache: the wallet (5 min) and league ranking keys all carry a TTL and rebuild from
    # Postgres, and nothing else lives here. So: no RDB or AOF (a flush loses nothing), a hard memory
    # cap, and LRU eviction over every key (allkeys-lru) instead of write errors when it fills.
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    healthcheck:
      <<: *health
      test: [CMD, redis-cli, ping]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "0.5", memory: 96M}}}

  objectstore:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: duolify-admin
      RUSTFS_SECRET_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [objectstore-data:/data]
    healthcheck:
      <<: *health
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health/ready]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  # One-shot: create versioned application and backup buckets (root credentials only here).
  s3-init:
    image: amazon/aws-cli:2.39.6
    environment:
      AWS_ACCESS_KEY_ID: duolify-admin
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://objectstore:9000
      AWS_CONFIG_FILE: /aws-config
      AWS_PAGER: ""
      S3_BUCKET: duolify
      BACKUP_BUCKET: duolify-backups
    volumes:
      - ../s3/init-buckets.sh:/init-buckets.sh:ro
      - ../s3/aws-config:/aws-config:ro
    entrypoint: [/bin/bash, /init-buckets.sh]
    depends_on:
      objectstore: {condition: service_healthy}
    restart: "no"
    logging: *logs

  # One-shot: scoped RustFS identities (app, backup writer/expirer/restorer).
  # The binary refuses anything but DUOLIFY_ENV=development by design: it only
  # administers this local RustFS, never a cloud object store.
  backup-init:
    image: ${BACKUP_INIT_IMAGE:-${IMAGE_REGISTRY:-duolify}/backup-init:${IMAGE_TAG:-local}}
    build: {context: ../../services/api, target: backup-init}
    environment:
      DUOLIFY_ENV: development
      S3_BUCKET: duolify
      S3_ACCESS_KEY_ID: duolify-app
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      S3_ROOT_ACCESS_KEY_ID: duolify-admin
      S3_ROOT_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      <<: *backup-writer
      BACKUP_EXPIRE_S3_ACCESS_KEY_ID: duolify-backup-expirer
      BACKUP_EXPIRE_S3_SECRET_ACCESS_KEY: ${BACKUP_EXPIRE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      BACKUP_RESTORE_S3_ACCESS_KEY_ID: duolify-backup-restorer
      BACKUP_RESTORE_S3_SECRET_ACCESS_KEY: ${BACKUP_RESTORE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      ASSET_RECOVERY_S3_ACCESS_KEY_ID: duolify-asset-recovery
      ASSET_RECOVERY_S3_SECRET_ACCESS_KEY: ${ASSET_RECOVERY_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
    depends_on:
      s3-init: {condition: service_completed_successfully}
    restart: "no"
    logging: *logs

  migrate:
    <<: *api-image
    command: [migrate]
    environment:
      <<: *app-env
      # One migration at a time: a small pool leaves the connection budget to the running instances.
      DB_POOL_MAX_CONNS: "2"
      DB_POOL_MIN_CONNS: "0"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *logs

  engine:
    image: ${ENGINE_IMAGE:-${IMAGE_REGISTRY:-duolify}/engine:${IMAGE_TAG:-local}}
    build: {context: ../.., dockerfile: engine/Dockerfile}
    environment:
      DUOLIFY_ENV: ${DUOLIFY_ENV:-development}
      ENGINE_ADDR_LISTEN: 0.0.0.0:50051
      ENGINE_DRAIN_TIMEOUT_SECS: ${ENGINE_DRAIN_TIMEOUT_SECS:-90}
      ENGINE_PROVIDER_MODE: ${ENGINE_PROVIDER_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Live narration needs NARRATION_LIVE_ENABLED=true plus the ElevenLabs key and voice; otherwise the mock speaks.
      NARRATION_LIVE_ENABLED: ${NARRATION_LIVE_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      ANALYTICS_OPT_OUT: ${ANALYTICS_OPT_OUT:-true}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    healthcheck:
      <<: *health
      test: [CMD, /grpc_health_probe, -addr=127.0.0.1:50051]
    restart: unless-stopped
    logging: *logs
    # SIGTERM drains in-flight RPCs for ENGINE_DRAIN_TIMEOUT_SECS; Docker's 10 s default would kill them.
    stop_grace_period: 120s
    deploy: {resources: {limits: {cpus: "1", memory: 384M}}}

  api:
    <<: *api-image
    command: [serve]
    environment:
      <<: [*app-env, *backup-writer]
      API_ADDR: :8080
      OPERATIONS_ADDR: :9091
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      # Soft heap target: about 80% of the 384M container limit, so the GC works before the OOM killer.
      GOMEMLIMIT: 300MiB
      # SIGTERM: stop accepting, fail /readyz, let in-flight requests and queue jobs finish this long.
      API_DRAIN_TIMEOUT: ${API_DRAIN_TIMEOUT:-90s}
    networks: [default, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /api, healthcheck]
    restart: unless-stopped
    logging: *logs
    stop_grace_period: 120s
    deploy: {resources: {limits: {cpus: "1", memory: 384M}}}

  # River jobs, including the encrypted nightly backup at 02:00 UTC (and on start).
  worker:
    image: ${WORKER_IMAGE:-${IMAGE_REGISTRY:-duolify}/worker:${IMAGE_TAG:-local}}
    build: {context: ../../services/api, target: worker}
    command: [worker]
    environment:
      <<: [*app-env, *backup-writer]
      POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
      OPERATIONS_ADDR: :9092
      GOMEMLIMIT: 300MiB
      # SIGTERM: stop fetching jobs; running jobs get this long, then are cancelled and retried.
      WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-90s}
      # Keeps the application object-store key from app-env: the lessons queue publishes
      # generated lessons, narration and example decks to the application bucket.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?run selfhost.sh init}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /api, healthcheck, --database]
    restart: unless-stopped
    logging: *logs
    stop_grace_period: 120s
    deploy: {resources: {limits: {cpus: "1", memory: 384M}}}

  # Read-only backup access for the restore drill (`selfhost.sh restore-drill`).
  backup-reader:
    image: amazon/aws-cli:2.39.6
    profiles: [tools]
    environment:
      AWS_ACCESS_KEY_ID: duolify-backup-restorer
      AWS_SECRET_ACCESS_KEY: ${BACKUP_RESTORE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://objectstore:9000
      AWS_CONFIG_FILE: /aws-config
      AWS_PAGER: ""
    volumes: [../s3/aws-config:/aws-config:ro]
    restart: "no"
    logging: *logs

networks:
  default: {}
  # Only the proxy and the API share this network; the proxy cannot reach data stores.
  edge: {}

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  caddy-data:
  caddy-config:
