# Self-hosted, production-shaped Duolify stack (ADR 0014). Self-contained: it
# does not extend the development docker-compose.yml. Drive it through
# `infra/deploy/selfhost.sh` (or the `mise run infra:selfhost-*` tasks), which
# pins the project name and env file. See docs/infra/selfhost.md.
#
# Only `proxy` publishes ports. Every other service, including the engine, is
# reachable only on the private Compose networks.
name: duolify-selfhost

x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

x-app-env: &app-env
  DUOLIFY_ENV: ${DUOLIFY_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://duolify:${POSTGRES_PASSWORD:?run selfhost.sh init}@postgres:5432/duolify?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  ENGINE_ADDR: http://engine:50051
  JWT_SECRET: ${JWT_SECRET:?run selfhost.sh init}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-}
  AUTH_TRUSTED_PROXY_HOPS: "1"
  API_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
  S3_ENDPOINT: http://objectstore:9000
  S3_BUCKET: duolify
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: duolify-app
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
  LESSON_ASSET_ORIGIN: ${LESSON_ASSET_ORIGIN:-http://localhost:9000}
  SHARING_PUBLIC_DOMAIN: ${SHARING_PUBLIC_DOMAIN:-localhost}
  PUSH_ADAPTER: disabled
  NARRATION_ENABLED: "false"
  POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
  POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
  ANALYTICS_OPT_OUT: ${ANALYTICS_OPT_OUT:-true}

x-backup-writer: &backup-writer
  BACKUP_S3_ENDPOINT: http://objectstore:9000
  BACKUP_S3_REGION: us-east-1
  BACKUP_S3_BUCKET: duolify-backups
  BACKUP_S3_ACCESS_KEY_ID: duolify-backup-writer
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}

x-api-image: &api-image
  image: ${IMAGE_REGISTRY:-duolify}/api:${IMAGE_TAG:-local}
  build: {context: ../../services/api, target: api}

services:
  proxy:
    image: ${IMAGE_REGISTRY:-duolify}/web:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: apps/client/Dockerfile, target: web}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes: [caddy-data:/data, caddy-config:/config]
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      <<: *health
      # Unpublished listener; works with or without automatic HTTPS.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "0.5", memory: 128M}}}

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: duolify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run selfhost.sh init}
      POSTGRES_DB: duolify
    volumes: [postgres-data:/var/lib/postgresql]
    shm_size: 256m
    healthcheck:
      <<: *health
      test: [CMD-SHELL, 'pg_isready -U duolify -d duolify']
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "2", memory: "${POSTGRES_MEMORY:-1G}"}}}

  redis:
    image: redis:8.4
    # Disposable (rebuilt from Postgres); the snapshot volume only smooths restarts.
    volumes: [redis-data:/data]
    healthcheck:
      <<: *health
      test: [CMD, redis-cli, ping]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "0.5", memory: 512M}}}

  objectstore:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: duolify-admin
      RUSTFS_SECRET_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [objectstore-data:/data]
    healthcheck:
      <<: *health
      test: [CMD, curl, --fail, --silent, http://localhost:9000/health/ready]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  # One-shot: create versioned application and backup buckets (root credentials only here).
  s3-init:
    image: amazon/aws-cli:2.39.6
    environment:
      AWS_ACCESS_KEY_ID: duolify-admin
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://objectstore:9000
      AWS_CONFIG_FILE: /aws-config
      AWS_PAGER: ""
      S3_BUCKET: duolify
      BACKUP_BUCKET: duolify-backups
    volumes:
      - ../s3/init-buckets.sh:/init-buckets.sh:ro
      - ../s3/aws-config:/aws-config:ro
    entrypoint: [/bin/bash, /init-buckets.sh]
    depends_on:
      objectstore: {condition: service_healthy}
    restart: "no"
    logging: *logs

  # One-shot: scoped RustFS identities (app, backup writer/expirer/restorer).
  # The binary refuses anything but DUOLIFY_ENV=development by design: it only
  # administers this local RustFS, never a cloud object store.
  backup-init:
    image: ${IMAGE_REGISTRY:-duolify}/backup-init:${IMAGE_TAG:-local}
    build: {context: ../../services/api, target: backup-init}
    environment:
      DUOLIFY_ENV: development
      S3_BUCKET: duolify
      S3_ACCESS_KEY_ID: duolify-app
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      S3_ROOT_ACCESS_KEY_ID: duolify-admin
      S3_ROOT_SECRET_ACCESS_KEY: ${S3_ROOT_SECRET_ACCESS_KEY:?run selfhost.sh init}
      <<: *backup-writer
      BACKUP_EXPIRE_S3_ACCESS_KEY_ID: duolify-backup-expirer
      BACKUP_EXPIRE_S3_SECRET_ACCESS_KEY: ${BACKUP_EXPIRE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      BACKUP_RESTORE_S3_ACCESS_KEY_ID: duolify-backup-restorer
      BACKUP_RESTORE_S3_SECRET_ACCESS_KEY: ${BACKUP_RESTORE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      ASSET_RECOVERY_S3_ACCESS_KEY_ID: duolify-asset-recovery
      ASSET_RECOVERY_S3_SECRET_ACCESS_KEY: ${ASSET_RECOVERY_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
    depends_on:
      s3-init: {condition: service_completed_successfully}
    restart: "no"
    logging: *logs

  migrate:
    <<: *api-image
    command: [migrate]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *logs

  engine:
    image: ${IMAGE_REGISTRY:-duolify}/engine:${IMAGE_TAG:-local}
    build: {context: ../.., dockerfile: engine/Dockerfile}
    environment:
      DUOLIFY_ENV: ${DUOLIFY_ENV:-development}
      ENGINE_ADDR_LISTEN: 0.0.0.0:50051
      ENGINE_PROVIDER_MODE: ${ENGINE_PROVIDER_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANALYTICS_OPT_OUT: ${ANALYTICS_OPT_OUT:-true}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    healthcheck:
      <<: *health
      test: [CMD, /grpc_health_probe, -addr=127.0.0.1:50051]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  api:
    <<: *api-image
    command: [serve]
    environment:
      <<: [*app-env, *backup-writer]
      API_ADDR: :8080
      OPERATIONS_ADDR: :9091
    networks: [default, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /api, healthcheck]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "1", memory: 512M}}}

  # River jobs, including the encrypted nightly backup at 02:00 UTC (and on start).
  worker:
    image: ${IMAGE_REGISTRY:-duolify}/worker:${IMAGE_TAG:-local}
    build: {context: ../../services/api, target: worker}
    command: [worker]
    environment:
      <<: [*app-env, *backup-writer]
      OPERATIONS_ADDR: :9092
      # Scoped backup identity only; no application object-store keys.
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?run selfhost.sh init}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /api, healthcheck, --database]
    restart: unless-stopped
    logging: *logs
    deploy: {resources: {limits: {cpus: "1", memory: 768M}}}

  # Read-only backup access for the restore drill (`selfhost.sh restore-drill`).
  backup-reader:
    image: amazon/aws-cli:2.39.6
    profiles: [tools]
    environment:
      AWS_ACCESS_KEY_ID: duolify-backup-restorer
      AWS_SECRET_ACCESS_KEY: ${BACKUP_RESTORE_S3_SECRET_ACCESS_KEY:?run selfhost.sh init}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://objectstore:9000
      AWS_CONFIG_FILE: /aws-config
      AWS_PAGER: ""
    volumes: [../s3/aws-config:/aws-config:ro]
    restart: "no"
    logging: *logs

networks:
  default: {}
  # Only the proxy and the API share this network; the proxy cannot reach data stores.
  edge: {}

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  caddy-data:
  caddy-config:
