groups:
  - name: duolify-operations
    rules:
      - alert: DuolifyOperationalIncident
        expr: increase(duolify_alerts_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Duolify {{ $labels.kind }} incident on {{ $labels.job }}"
      - alert: DuolifyOperationalTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Duolify {{ $labels.job }} metrics unavailable"
  - name: duolify-data-protection
    rules:
      - alert: DuolifyDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes < 0.15
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "Less than 15% disk free on {{ $labels.mountpoint }}"}
      - alert: DuolifyWALArchiveFailing
        expr: increase(duolify_pg_archive_failed_total[15m]) > 0
        labels: {severity: critical}
        annotations: {summary: "Postgres archive_command is failing; PITR window is shrinking"}
      - alert: DuolifyWALSpoolBacklog
        expr: duolify_wal_spool_oldest_age_seconds > 900
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "WAL segments wait over 15 minutes to reach the off-site bucket"}
      - alert: DuolifyBackupStale
        expr: time() - duolify_dump_last_object_timestamp_seconds > 129600 or time() - duolify_base_last_success_timestamp_seconds > 129600
        labels: {severity: critical}
        annotations: {summary: "Newest nightly dump or base backup is older than 36 hours"}
      - alert: DuolifyBucketUsageHigh
        expr: duolify_bucket_bytes > 0.8 * 1099511627776
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "Bucket {{ $labels.bucket }} holds over 0.8 TiB; review plan and retention"}
      - alert: DuolifyDRCopyStale
        expr: time() - duolify_dr_last_success_timestamp_seconds > 129600
        labels: {severity: critical}
        annotations: {summary: "The lesson-assets DR copy is older than 36 hours"}
      # A series that was never written is as bad as an old one: time() - x is empty without x,
      # so these absent() rules catch "no backup / DR copy / walship metrics at all".
      - alert: DuolifyBaseBackupMissing
        expr: absent(duolify_base_last_success_timestamp_seconds)
        for: 2h
        labels: {severity: critical}
        annotations: {summary: "No base backup has ever succeeded (or walship metrics are gone); PITR is impossible"}
      - alert: DuolifyNoRecentBaseInBucket
        expr: time() - duolify_base_newest_object_timestamp_seconds > 129600 or absent(duolify_base_newest_object_timestamp_seconds)
        for: 1h
        labels: {severity: critical}
        annotations: {summary: "The backup bucket holds no base backup newer than 36 hours; the PITR window is not backed by a base"}
      - alert: DuolifyDRCopyMissing
        expr: absent(duolify_dr_last_success_timestamp_seconds)
        for: 2h
        labels: {severity: critical}
        annotations: {summary: "The lesson-assets DR copy has never succeeded"}
      - alert: DuolifyWalshipMetricsMissing
        expr: absent(duolify_wal_spool_oldest_age_seconds) or time() - node_textfile_mtime_seconds{file=~".*walship.prom"} > 600
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "walship metrics are missing or stale; WAL shipping and backup jobs are not being observed"}
