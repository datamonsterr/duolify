# promtool unit tests for alerts.yml: `promtool test rules alerts.test.yml` (run by infra:lint).
rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - name: never-written backup, DR and walship metrics fire absent() rules
    input_series:
      - {series: 'up{job="node"}', values: '1+0x400'}
    alert_rule_test:
      - eval_time: 3h
        alertname: DuolifyBaseBackupMissing
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "No base backup has ever succeeded (or walship metrics are gone); PITR is impossible"}}]
      - eval_time: 3h
        alertname: DuolifyDRCopyMissing
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "The lesson-assets DR copy has never succeeded"}}]
      - eval_time: 3h
        alertname: DuolifyNoRecentBaseInBucket
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "The backup bucket holds no base backup newer than 36 hours; the PITR window is not backed by a base"}}]
      - eval_time: 3h
        alertname: DuolifyWalshipMetricsMissing
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "walship metrics are missing or stale; WAL shipping and backup jobs are not being observed"}}]
  - name: healthy fresh backups raise nothing
    input_series:
      - {series: 'duolify_base_last_success_timestamp_seconds', values: '0+0x400'}
      - {series: 'duolify_base_newest_object_timestamp_seconds', values: '0+0x400'}
      - {series: 'duolify_dr_last_success_timestamp_seconds', values: '0+0x400'}
      - {series: 'duolify_wal_spool_oldest_age_seconds', values: '0+0x400'}
      - {series: 'node_textfile_mtime_seconds{file="/metrics/walship.prom"}', values: '0+60x400'}
    alert_rule_test:
      - {eval_time: 3h, alertname: DuolifyBaseBackupMissing, exp_alerts: []}
      - {eval_time: 3h, alertname: DuolifyDRCopyMissing, exp_alerts: []}
      - {eval_time: 3h, alertname: DuolifyNoRecentBaseInBucket, exp_alerts: []}
      - {eval_time: 3h, alertname: DuolifyWalshipMetricsMissing, exp_alerts: []}
      - {eval_time: 3h, alertname: DuolifyBackupStale, exp_alerts: []}
  - name: a base backup older than 36h is stale
    input_series:
      - {series: 'duolify_base_last_success_timestamp_seconds', values: '0+0x3000'}
      - {series: 'duolify_base_newest_object_timestamp_seconds', values: '0+0x3000'}
    alert_rule_test:
      - eval_time: 40h
        alertname: DuolifyBackupStale
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "Newest nightly dump or base backup is older than 36 hours"}}]
      - eval_time: 40h
        alertname: DuolifyNoRecentBaseInBucket
        exp_alerts: [{exp_labels: {severity: critical}, exp_annotations: {summary: "The backup bucket holds no base backup newer than 36 hours; the PITR window is not backed by a base"}}]
