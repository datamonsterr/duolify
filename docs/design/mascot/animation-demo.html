<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buo animation demo</title>
<style>
:root{--m-body:#58C322;--m-body-edge:#46A01A;--m-trim:#1F7A0D;--m-trim-edge:#145208;--m-visor:#0E2606;--m-eye:#E3F8D3;--m-accent:#FFC233;--m-cheek:#FF8A00;--m-sky:#4DA6F0;--m-violet:#7B3FE4;--bg:#F7F9F4;--surface:#fff;--text:#2B2B2B;--line:#E3E3E3}
@media (prefers-color-scheme:dark){:root{--bg:#131F24;--surface:#1C2B31;--text:#F1F7F2;--line:#26383F;--m-body:#6CD43A;--m-body-edge:#3E8F1B;--m-trim:#3E8F1B;--m-trim-edge:#0E2606}}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.4 Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
h1{font-size:24px;margin:0 0 4px}p{margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
figure{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.stage{height:200px;display:grid;place-items:center}figcaption{font-weight:800}
.mascot{overflow:visible}.mascot *{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes talk{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
@keyframes cheer{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
@keyframes cheerr{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes wave{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
.mascot .m-eyes{animation:blink 4s infinite}
.idle .m-head{animation:float 3s ease-in-out infinite}
.talking .m-mouth{animation:talk .36s ease-in-out infinite}
.talking .m-wave{animation:wave .6s infinite}
.thinking .m-bulb{animation:pulse 1s ease-in-out infinite}
.thinking .m-eyes{animation:drift 2.4s ease-in-out infinite}
.thinking .m-dot{animation:pulse 1.2s infinite}
.celebrate svg,.celebrate{}
.celebrate .m-head{animation:hop .7s ease-in-out infinite}
.celebrate .m-arm-l{animation:cheer .7s ease-in-out infinite}
.celebrate .m-arm-r{animation:cheerr .7s ease-in-out infinite}}
</style></head><body>
<h1>Buo animation demo</h1>
<p>Pure CSS on the SVG parts (no runtime). With reduced motion enabled every pose is static. In the app, animations pause when the mascot is off-screen.</p>
