[workspace]
members = ["crates/engine-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
toml = "1"
regex = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
