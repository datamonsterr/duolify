[workspace]
members = ["crates/*"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "MIT"
[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-proto = { path = "crates/engine-proto" }
engine-providers = { path = "crates/engine-providers" }
anyhow = "=1.0.104"
async-trait = "0.1"
futures = "0.3"
prost = "=0.14.4"
regex = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "=0.14.9"
tonic-prost = "=0.14.9"
tonic-prost-build = "=0.14.9"
tonic-health = "=0.14.9"
tonic-reflection = "=0.14.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
wiremock = "=0.6.5"
[profile.release]
lto = "thin"
codegen-units = 1
