# Single source of truth for toolchain versions and project tasks.
# Tasks live in .mise/tasks/<area>.toml (one file per area) so parallel work does not conflict.
min_version = "2026.10.0"

[tools]
go = "1.27"
rust = { version = "1.99", components = "rustfmt,clippy" }
node = "24"
pnpm = "12"
protoc = "36"
buf = "1.75"
golangci-lint = "2.15"
gotestsum = "latest"
"cargo:cargo-nextest" = "latest"
actionlint = "1.7"
shellcheck = "0.11"
hadolint = "2.15"
lefthook = "2"
railway = "5"
k6 = "2"
hcloud = "1.70"
uv = "0.13"

[env]
# Local, untracked secrets. Copy .env.example to .env and fill it in.
_.file = ".env"
# mise lets .env replace the caller's environment. For these keys a non-empty value
# exported in the caller's shell wins over .env, and an empty value never overrides a
# non-empty one.
OPENROUTER_API_KEY = '{% if get_env(name="OPENROUTER_API_KEY", default="") != "" %}{{ get_env(name="OPENROUTER_API_KEY") }}{% else %}{{ env.OPENROUTER_API_KEY | default(value="") }}{% endif %}'
ELEVENLABS_API_KEY = '{% if get_env(name="ELEVENLABS_API_KEY", default="") != "" %}{{ get_env(name="ELEVENLABS_API_KEY") }}{% else %}{{ env.ELEVENLABS_API_KEY | default(value="") }}{% endif %}'
ELEVENLABS_VOICE_ID = '{% if get_env(name="ELEVENLABS_VOICE_ID", default="") != "" %}{{ get_env(name="ELEVENLABS_VOICE_ID") }}{% else %}{{ env.ELEVENLABS_VOICE_ID | default(value="") }}{% endif %}'
HF_TOKEN = '{% if get_env(name="HF_TOKEN", default="") != "" %}{{ get_env(name="HF_TOKEN") }}{% else %}{{ env.HF_TOKEN | default(value="") }}{% endif %}'

[task_config]
includes = [".mise/tasks/*.toml"]
