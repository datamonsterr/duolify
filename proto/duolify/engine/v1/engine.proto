syntax = "proto3";

package duolify.engine.v1;

option go_package = "github.com/datamonsterr/duolify/services/api/gen/duolify/engine/v1;enginev1";

// EngineService is the private AI engine. Only services/api calls it.
// The engine is stateless: every request carries the context it needs.
service EngineService {
  // ScreenInstruction classifies untrusted style/focus data at platform expense.
  rpc ScreenInstruction(ScreenInstructionRequest) returns (ScreenInstructionResponse);
  // ReplanOutline proposes remaining content; protected lessons must be echoed unchanged.
  rpc ReplanOutline(ReplanOutlineRequest) returns (ReplanOutlineResponse);
  // ScreenCharacter screens a free structured edit; never maps prompts or bills Credits.
  rpc ScreenCharacter(ScreenCharacterRequest) returns (ScreenCharacterResponse);
  rpc MapCharacter(MapCharacterRequest) returns (MapCharacterResponse);
  // ScreenCourse classifies a bounded, allowlisted publication sample (<=12 lessons). Platform-funded; never bills Credits.
  rpc ScreenCourse(ScreenCourseRequest) returns (ScreenCourseResponse);
  // Health reports readiness and configured providers.
  rpc Health(HealthRequest) returns (HealthResponse);
  // PreviewCourse returns a sample outline and example slides before the learner commits.
  rpc PreviewCourse(PreviewCourseRequest) returns (PreviewCourseResponse);
  // GenerateCourseOutline returns units and lesson titles only. No lesson content.
  rpc GenerateCourseOutline(GenerateCourseOutlineRequest) returns (GenerateCourseOutlineResponse);
  // GenerateLesson builds one lesson (slides + test). Called only after the previous lesson test is passed.
  rpc GenerateLesson(GenerateLessonRequest) returns (stream GenerateLessonEvent);
  // GenerateRetryVariants produces paraphrased questions for missed topics.
  rpc GenerateRetryVariants(GenerateRetryVariantsRequest) returns (GenerateRetryVariantsResponse);
  // Chat streams a tutor reply with course, lesson and learner context.
  rpc Chat(ChatRequest) returns (stream ChatEvent);
  // EnrichNote turns a quick note into a summary, tags and links.
  rpc EnrichNote(EnrichNoteRequest) returns (EnrichNoteResponse);
  // SetupChat guides onboarding and learner profile configuration.
  rpc SetupChat(SetupChatRequest) returns (SetupChatResponse);
  // CourseBriefChat clarifies intent without generating or persisting a course.
  rpc CourseBriefChat(CourseBriefChatRequest) returns (CourseBriefChatResponse);
  // OutlineChatChange proposes typed edits to an owned pre-creation draft.
  rpc OutlineChatChange(OutlineChatChangeRequest) returns (OutlineChatChangeResponse);
  // SynthesizeNarration turns stored Slide narration text into audio with character alignment (E14).
  rpc SynthesizeNarration(SynthesizeNarrationRequest) returns (SynthesizeNarrationResponse);
}

message SynthesizeNarrationRequest {
  string slide_id = 1;
  // Plain narration text already stored by the API; never logged or sent to analytics.
  string text = 2;
  string language = 3;
  // Logical voice key (`default`); the engine resolves the voice id from its config.
  string voice_key = 4;
  UsageLimits limits = 5;
  // Return only the resolved voice/model/settings so the API can look up the dedup key first.
  bool resolve_only = 6;
  // E17-08 additive: one pinned-Cast dialogue segment. `segment_id` is stable per Slide and order,
  // `speaker_key` names the pinned speaker and `voice_key` is the Character's logical voice key,
  // resolved only through the approved voice config (never a provider id). Empty for slide narration.
  string segment_id = 7;
  string speaker_key = 8;
}

// Alignment lists one entry per Unicode scalar value of the text, in order.
message NarrationAlignment {
  repeated string characters = 1;
  repeated uint32 start_ms = 2;
  repeated uint32 end_ms = 3;
}

message SynthesizeNarrationResponse {
  bytes audio = 1;
  string audio_format = 2;
  uint32 duration_ms = 3;
  NarrationAlignment alignment = 4;
  string voice_id = 5;
  string model_id = 6;
  // Stable fingerprint of the resolved voice settings; part of the dedup key.
  string settings_fingerprint = 7;
  uint32 characters = 8;
  uint32 audio_bytes = 9;
  // Actual usage (component `audio`, narration_characters) for settlement.
  Usage usage = 10;
  // E17-08 additive: the logical voice actually used, the approved voice config version that
  // resolved it, and a fixed reason code when a Character voice fell back to the safe default.
  string voice_key = 11;
  string voice_config_version = 12;
  string voice_fallback_reason = 13;
  string segment_id = 14;
  string speaker_key = 15;
}

message MapCharacterRequest {
  string prompt = 1;
  UsageLimits limits = 2;
}

message MapCharacterResponse {
  string spec_json = 1;
  repeated Usage attempts = 2;
}

message ScreenCharacterRequest {
  string spec_json = 1;
  // Only the API's trusted compiler may populate this value.
  string compiled_appearance = 2;
  string raw_prompt = 3;
  UsageLimits limits = 4;
}

message ScreenCharacterResponse {
  bool approved = 1;
  string reason_code = 2;
  string policy_version = 3;
  repeated Usage attempts = 4;
}

message ScreenCourseRequest {
  // Allowlisted sample built by the API (outline plus <=12 lessons). Untrusted data.
  string sample_json = 1;
  uint32 sampled_lessons = 2;
  UsageLimits limits = 3;
}

message ScreenCourseResponse {
  // pass | needs_review | block
  string verdict = 1;
  // Closed codes: personal_data, secret, real_person, third_party_ip, sexual_content,
  // age_inappropriate, prompt_injection, hidden_payload, harmful_content.
  repeated string reason_codes = 2;
  string policy_version = 3;
  repeated Usage attempts = 4;
}

message HealthRequest {}

message HealthResponse {
  string version = 1;
  repeated string providers = 2;
}

// Usage is reported on every AI response so the API can settle credits.
message Usage {
  string provider = 1;
  string model = 2;
  uint32 input_tokens = 3;
  uint32 output_tokens = 4;
  uint32 latency_ms = 5;
  uint32 cache_write_tokens = 6;
  uint32 cache_read_tokens = 7;
  uint32 narration_characters = 8;
  bool fallback_used = 9;
  uint32 attempt = 10;
  string component = 11;
  bool delivered = 12;
  bool cached = 13;
  string artifact_id = 14;
  bool usage_unavailable = 15;
  string error_code = 16;
  // Tokens were estimated from delivered bytes (bounded by the quote) because the provider
  // sent no final usage frame; the API settles them as partial usage.
  bool estimated = 17;
}

// Bounds come only from the API's immutable Pricing quote, never client prices.
message UsageLimits {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 timeout_ms = 3;
  uint32 max_attempts = 4;
  uint64 max_cost_nanos = 5;
  uint64 input_nanos = 6;
  uint64 output_nanos = 7;
  uint64 cache_write_nanos = 8;
  uint64 cache_read_nanos = 9;
  string provider = 10;
  string model = 11;
  string fallback_provider = 12;
  string fallback_model = 13;
  // Absolute reservation deadline, including API queue and transport time.
  uint64 deadline_unix_ms = 14;
  uint32 first_token_timeout_ms = 15;
  uint32 idle_timeout_ms = 16;
}

message LearnerProfile {
  string learner_id = 1;
  string locale = 2;
  string background = 3;
  string goals = 4;
  string level = 5;
  string topic = 6;
  uint32 daily_minutes = 7;
  uint32 daily_xp = 8;
  bool reminder_enabled = 9;
  string reminder_time = 10;
  string time_zone = 11;
}

message LessonRef {
  string lesson_id = 1;
  string title = 2;
  string goal = 3;
}

message Unit {
  string unit_id = 1;
  string title = 2;
  repeated LessonRef lessons = 3;
}

message CourseOutline {
  string course_id = 1;
  string title = 2;
  string description = 3;
  repeated Unit units = 4;
}

// Slide is one Motion HTML document.
message Slide {
  string slide_id = 1;
  string html = 2;
  uint32 duration_ms = 3;
  string narration = 4;
  repeated string topic_ids = 5;
  repeated CharacterSegment segments = 6;
}

// Plain text dialogue; keys resolve exclusively through the API-pinned Cast.
message CharacterSegment {
  string speaker_key = 1;
  string text = 2;
  string expression = 3;
  uint32 start_ms = 4;
  uint32 duration_ms = 5;
}

message Question {
  string question_id = 1;
  string prompt = 2;
  repeated string choices = 3;
  uint32 answer_index = 4;
  string explanation = 5;
  string topic_id = 6;
  string variant_of = 7;
}

message TopicVariants {
  string topic_id = 1;
  repeated Question variants = 2;
}

message Lesson {
  repeated string applied_instruction_ids = 20;
  LessonRef ref = 1;
  repeated Slide slides = 2;
  repeated Question test = 3;
  repeated TopicVariants variant_pool = 4;
}

message PreviewCourseRequest {
  string topic = 1;
  LearnerProfile learner = 2;
  UsageLimits limits = 3;
  CourseBrief brief = 4;
  string brief_revision = 5;
  string brief_hash = 6;
}

message PreviewCourseResponse {
  CourseOutline sample_outline = 1;
  repeated Slide example_slides = 2;
  Usage usage = 3;
  repeated Usage attempts = 4;
  bool unavailable = 5;
}

message GenerateCourseOutlineRequest {
  string topic = 1;
  LearnerProfile learner = 2;
  CourseOutline edited_outline = 3;
  int64 outline_revision = 4;
  string draft_id = 5;
  UsageLimits limits = 6;
  CourseBrief brief = 7;
}

message GenerateCourseOutlineResponse {
  CourseOutline outline = 1;
  Usage usage = 2;
  repeated Usage attempts = 3;
  bool unavailable = 4;
  int64 outline_revision = 5;
}

message CourseInstruction {
  string id = 1;
  string text = 2;
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_NEXT_LESSON = 1;
    SCOPE_REST_OF_COURSE = 2;
  }
  Scope scope = 3;
  int64 added_at_unix_ms = 4;
  uint32 version = 5;
}

message ScreenInstructionRequest {
  string text = 1;
  string course_topic = 2;
}

message ScreenInstructionResponse {
  bool allowed = 1;
  string reason_code = 2;
  string screening_version = 3;
  repeated Usage attempts = 4;
}

message ReplanOutlineRequest {
  CourseOutline outline = 1;
  repeated string protected_lesson_ids = 2;
  repeated CourseInstruction instructions = 3;
  LearnerProfile learner = 4;
  UsageLimits limits = 5;
}

message ReplanOutlineResponse {
  CourseOutline outline = 1;
  repeated Usage attempts = 2;
  bool unavailable = 3;
}

message GenerateLessonRequest {
  CourseOutline outline = 1;
  LessonRef lesson = 2;
  LearnerProfile learner = 3;
  // Summaries of completed lessons and test results, oldest first.
  repeated string history = 4;
  UsageLimits limits = 5;
  // Immutable validated JSON, data only, below trusted lesson/Course policy.
  string character_personas_json = 6;
  repeated CourseInstruction instructions = 20;
}

message GenerateLessonEvent {
  oneof event {
    string progress = 1;
    Slide slide = 2;
    Lesson lesson = 3;
    Usage usage = 4;
    Usage attempt = 5;
    bool unavailable = 6;
  }
}

message GenerateRetryVariantsRequest {
  repeated CourseInstruction instructions = 20;
  Question source = 1;
  repeated Question previous_variants = 2;
  LearnerProfile learner = 3;
  UsageLimits limits = 4;
  string character_personas_json = 5;
}

message GenerateRetryVariantsResponse {
  repeated Question variants = 1;
  Usage usage = 2;
  repeated Usage attempts = 3;
  bool unavailable = 4;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  CourseOutline outline = 1;
  Lesson current_lesson = 2;
  LearnerProfile learner = 3;
  repeated string history = 4;
  repeated ChatMessage messages = 5;
  UsageLimits limits = 6;
  // Source passages retrieved from the Learner's own older lessons in this Course. Untrusted data.
  repeated SourceExcerpt excerpts = 7;
  // E17-07: API-validated, bounded tutor persona JSON ({name,bio,backstory,traits,speaking_style,persona_prompt}).
  // Untrusted style data, never instructions. Empty means the neutral tutor.
  string tutor_persona_json = 8;
}

message SourceExcerpt {
  string lesson_id = 1;
  string lesson_title = 2;
  string text = 3;
}

// A typed streaming failure. `code` is one of first_token_timeout, idle_timeout,
// deadline_exceeded or provider_error. The stream ends after it, preceded by exactly one
// (possibly estimated) Usage frame.
message ChatStreamError {
  string code = 1;
  bool retryable = 2;
}

message ChatEvent {
  oneof event {
    string delta = 1;
    Usage usage = 2;
    Usage attempt = 3;
    string error_code = 4;
    ChatStreamError stream_error = 5;
  }
}

message EnrichNoteRequest {
  string note = 1;
  LessonRef lesson = 2;
  LearnerProfile learner = 3;
  UsageLimits limits = 4;
  repeated LessonRef allowed_lessons = 5;
}

message EnrichNoteResponse {
  string summary = 1;
  repeated string tags = 2;
  repeated string links = 3;
  Usage usage = 4;
  repeated Usage attempts = 5;
  bool unavailable = 6;
}

message QuickReply {
  string id = 1;
  string label = 2;
}

message SetupChatMessage {
  string role = 1;
  string content = 2;
}

message SetupChatRequest {
  LearnerProfile profile = 1;
  repeated SetupChatMessage messages = 2;
  string current_step = 3;
  string answer = 4;
  bool skipped = 5;
  bool is_follow_up = 6;
}

message SetupChatResponse {
  string message = 1;
  repeated QuickReply quick_replies = 2;
  LearnerProfile updated_profile = 3;
  string next_step = 4;
  bool is_follow_up = 5;
  bool is_complete = 6;
  Usage usage = 7;
}

// CourseBrief is learner-authored intent. Empty strings mean unanswered or skipped.
message CourseBrief {
  string topic = 1;
  string goal = 2;
  string include_topics = 3;
  string skip_topics = 4;
  string level = 5;
  string maths = 6;
  string viewing_conditions = 7;
  string lesson_length = 8;
  string language = 9;
}

// Limits are resolved from the selected Pricing config by the trusted API.
message CourseBriefLimits {
  uint32 input_tokens = 1;
  uint32 output_tokens = 2;
  uint32 attempt_timeout_ms = 3;
  uint32 max_attempts = 4;
  uint64 max_cost_nanos = 5;
  uint64 input_nanos_per_token = 6;
  uint64 output_nanos_per_token = 7;
}

message CourseBriefChatRequest {
  CourseBrief brief = 1;
  string current_step = 2;
  string answer = 3;
  bool skipped = 4;
  bool is_follow_up = 5;
  CourseBriefLimits limits = 6;
}

// Failed attempts retain available usage, without prompt or completion capture.
message BriefAttempt {
  Usage usage = 1;
  bool fallback_used = 2;
  bool succeeded = 3;
  // Route identifiers remain known even when token usage is unavailable.
  string provider = 4;
  string model = 5;
}

message CourseBriefChatResponse {
  CourseBrief brief = 1;
  string message = 2;
  repeated QuickReply quick_replies = 3;
  string next_step = 4;
  bool is_follow_up = 5;
  bool is_complete = 6;
  repeated BriefAttempt attempts = 7;
  bool unavailable = 8;
}

// Positions are zero-based within the destination after removal. IDs never change.
message OutlineOperation {
  string kind = 1;
  string id = 2;
  string parent_id = 3;
  int32 position = 4;
  string title = 5;
  string goal = 6;
}

message OutlineChatChangeRequest {
  string proposal_id = 1;
  string draft_id = 2;
  int64 base_revision = 3;
  CourseOutline outline = 4;
  string request = 5;
  UsageLimits limits = 6;
}

message OutlineChatChangeResponse {
  repeated OutlineOperation operations = 1;
  repeated Usage attempts = 2;
  bool unavailable = 3;
}
