syntax = "proto3";

package duolify.engine.v1;

option go_package = "github.com/datamonsterr/duolify/services/api/gen/duolify/engine/v1;enginev1";

// EngineService is the private AI engine. Only services/api calls it.
// The engine is stateless: every request carries the context it needs.
service EngineService {
  // Health reports readiness and configured providers.
  rpc Health(HealthRequest) returns (HealthResponse);
  // PreviewCourse returns a sample outline and example slides before the learner commits.
  rpc PreviewCourse(PreviewCourseRequest) returns (PreviewCourseResponse);
  // GenerateCourseOutline returns units and lesson titles only. No lesson content.
  rpc GenerateCourseOutline(GenerateCourseOutlineRequest) returns (GenerateCourseOutlineResponse);
  // GenerateLesson builds one lesson (slides + test). Called only after the previous lesson test is passed.
  rpc GenerateLesson(GenerateLessonRequest) returns (stream GenerateLessonEvent);
  // Chat streams a tutor reply with course, lesson and learner context.
  rpc Chat(ChatRequest) returns (stream ChatEvent);
  // EnrichNote turns a quick note into a summary, tags and links.
  rpc EnrichNote(EnrichNoteRequest) returns (EnrichNoteResponse);
  // SetupChat guides onboarding and learner profile configuration.
  rpc SetupChat(SetupChatRequest) returns (SetupChatResponse);
}

message HealthRequest {}

message HealthResponse {
  string version = 1;
  repeated string providers = 2;
}

// Usage is reported on every AI response so the API can settle credits.
message Usage {
  string provider = 1;
  string model = 2;
  uint32 input_tokens = 3;
  uint32 output_tokens = 4;
  uint32 latency_ms = 5;
}

message LearnerProfile {
  string learner_id = 1;
  string locale = 2;
  string background = 3;
  string goals = 4;
  string level = 5;
  string topic = 6;
  uint32 daily_minutes = 7;
  uint32 daily_xp = 8;
  bool reminder_enabled = 9;
  string reminder_time = 10;
  string time_zone = 11;
}

message LessonRef {
  string lesson_id = 1;
  string title = 2;
  string goal = 3;
}

message Unit {
  string unit_id = 1;
  string title = 2;
  repeated LessonRef lessons = 3;
}

message CourseOutline {
  string course_id = 1;
  string title = 2;
  string description = 3;
  repeated Unit units = 4;
}

// Slide is one Motion HTML document.
message Slide {
  string slide_id = 1;
  string html = 2;
  uint32 duration_ms = 3;
  string narration = 4;
}

message Question {
  string question_id = 1;
  string prompt = 2;
  repeated string choices = 3;
  uint32 answer_index = 4;
  string explanation = 5;
}

message Lesson {
  LessonRef ref = 1;
  repeated Slide slides = 2;
  repeated Question test = 3;
}

message PreviewCourseRequest {
  string topic = 1;
  LearnerProfile learner = 2;
}

message PreviewCourseResponse {
  CourseOutline sample_outline = 1;
  repeated Slide example_slides = 2;
  Usage usage = 3;
}

message GenerateCourseOutlineRequest {
  string topic = 1;
  LearnerProfile learner = 2;
}

message GenerateCourseOutlineResponse {
  CourseOutline outline = 1;
  Usage usage = 2;
}

message GenerateLessonRequest {
  CourseOutline outline = 1;
  LessonRef lesson = 2;
  LearnerProfile learner = 3;
  // Summaries of completed lessons and test results, oldest first.
  repeated string history = 4;
}

message GenerateLessonEvent {
  oneof event {
    string progress = 1;
    Slide slide = 2;
    Lesson lesson = 3;
    Usage usage = 4;
  }
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  CourseOutline outline = 1;
  Lesson current_lesson = 2;
  LearnerProfile learner = 3;
  repeated string history = 4;
  repeated ChatMessage messages = 5;
}

message ChatEvent {
  oneof event {
    string delta = 1;
    Usage usage = 2;
  }
}

message EnrichNoteRequest {
  string note = 1;
  LessonRef lesson = 2;
  LearnerProfile learner = 3;
}

message EnrichNoteResponse {
  string summary = 1;
  repeated string tags = 2;
  repeated string links = 3;
  Usage usage = 4;
}

message QuickReply {
  string id = 1;
  string label = 2;
}

message SetupChatMessage {
  string role = 1;
  string content = 2;
}

message SetupChatRequest {
  LearnerProfile profile = 1;
  repeated SetupChatMessage messages = 2;
  string current_step = 3;
  string answer = 4;
  bool skipped = 5;
  bool is_follow_up = 6;
}

message SetupChatResponse {
  string message = 1;
  repeated QuickReply quick_replies = 2;
  LearnerProfile updated_profile = 3;
  string next_step = 4;
  bool is_follow_up = 5;
  bool is_complete = 6;
  Usage usage = 7;
}
