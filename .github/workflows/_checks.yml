name: Shared checks

on:
  workflow_call:
    inputs:
      tier:
        description: fast for drafts, full for ready PRs, main and merge queues
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      HF_TOKEN:
        required: false
      ELEVENLABS_API_KEY:
        required: false
      ELEVENLABS_VOICE_ID:
        required: false
      RAILWAY_TOKEN:
        required: false

permissions:
  contents: read

env:
  CI: 'true'
  MISE_AUTO_INSTALL: 'false'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # gotestsum: grouped log output; each test step also writes JUnit (see ci:summary).
  GOTESTSUM_FORMAT: github-actions

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proto: ${{ github.event_name != 'pull_request' || steps.paths.outputs.proto == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.paths.outputs.api == 'true' }}
      engine: ${{ github.event_name != 'pull_request' || steps.paths.outputs.engine == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.paths.outputs.client == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.paths.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: paths
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.before || 'main' }}
          filters: |
            proto:
              - 'proto/**'
              - 'buf*.yaml'
              - 'services/api/gen/**'
              - '.mise/tasks/proto.toml'
              - &tooling 'mise.toml'
              - &tasks '.mise/tasks/ci.toml'
              - &github '.github/**'
              - &scripts 'scripts/ci/**'
            api:
              - 'services/api/**'
              - 'proto/**'
              - 'buf*.yaml'
              - '.mise/tasks/api.toml'
              - *tooling
              - *tasks
              - *github
              - *scripts
            engine:
              - 'engine/**'
              - 'proto/**'
              - 'evals/**'
              # Embedded by engine-core and fingerprinted by the promotion evidence.
              - 'services/api/internal/characters/schema/**'
              - 'services/api/internal/characters/rig/**'
              - '.mise/tasks/engine.toml'
              - *tooling
              - *tasks
              - *github
              - *scripts
            client:
              - 'apps/client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.mise/tasks/client.toml'
              - '.mise/tasks/client-stack.toml'
              - '.mise/tasks/mobile.toml'
              - *tooling
              - *tasks
              - *github
              - *scripts
            infra:
              - 'infra/**'
              - '.railway/**'
              - 'docker-compose*.yml'
              - 'compose*.yaml'
              - '**/Dockerfile*'
              - '**/.dockerignore'
              - '.env.example'
              - '.mise/tasks/infra.toml'
              - *tooling
              - *tasks
              - *github
              - *scripts

  # Jobs run in parallel. Cheap checks (lint, typecheck, unit tests) live in their
  # own jobs and are listed first, so they start first and fail first; slower jobs
  # (integration shards, Playwright, Tauri, Docker) never gate them.
  repo-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: actionlint shellcheck node npm:@fission-ai/openspec@1.3.1
          area: repo-lint
      - name: mise run ci:lint
        run: mise run ci:lint
        timeout-minutes: 2
      - name: mise run ci:api-integration-shards
        run: mise run ci:api-integration-shards
        timeout-minutes: 1
      - name: mise run ci:sql-casts
        run: mise run ci:sql-casts
        timeout-minutes: 1
      - name: mise run ci:openspec
        run: mise run ci:openspec
        timeout-minutes: 2
      - name: mise run release:test
        run: mise run release:lint && mise run release:test
        timeout-minutes: 1
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # proto:breaking fetches main using the read-only checkout credential.
          persist-credentials: true
      - uses: ./.github/actions/setup-proto
      - name: mise run proto:lint
        run: mise run proto:lint
      - name: mise run proto:gen
        run: mise run proto:gen
        timeout-minutes: 4
      - name: mise run ci:proto-drift
        run: mise run ci:proto-drift
      - name: mise run ci:proto-main
        if: inputs.tier == 'full'
        run: mise run ci:proto-main
      - name: mise run proto:breaking
        if: inputs.tier == 'full'
        run: mise run proto:breaking
        timeout-minutes: 2
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-api
      - name: mise run api:lint
        run: mise run api:lint
        timeout-minutes: 5
      - name: mise run api:test
        run: mise run api:test
        timeout-minutes: 5
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/api-test.xml
      - name: mise run api:build
        run: mise run api:build
        timeout-minutes: 2
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  client-web:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-client
      - name: mise run client:lint-web
        run: mise run client:lint-web
        timeout-minutes: 6
      - name: mise run client:test-web
        run: mise run client:test-web
        timeout-minutes: 5
      - name: mise run client:build
        run: mise run client:build
        timeout-minutes: 3
        env:
          VITEST_JUNIT_FILE: ./test-results/vitest-boundary-junit.xml
      - name: mise run client:bundle-budget
        run: mise run client:bundle-budget
        timeout-minutes: 1
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: hadolint
          area: infra-lint
      - name: mise run infra:lint
        run: mise run infra:lint
        timeout-minutes: 6
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  engine-lint:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          cache-key: lint
      - name: mise run engine:lint
        run: mise run engine:lint
        timeout-minutes: 12
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  client-native:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-client
        with:
          tauri: 'true'
          cache-key: native
      - name: mise run client:lint-native
        run: mise run client:lint-native
        timeout-minutes: 8
      - name: mise run client:test-native
        run: mise run client:test-native
        timeout-minutes: 6
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  engine-build:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          cache-key: build
      - name: mise run engine:build
        run: mise run engine:build
        timeout-minutes: 6
      - name: mise run ci:engine-archive
        run: mise run ci:engine-archive
        timeout-minutes: 6
      - uses: actions/upload-artifact@v7
        with:
          name: engine-nextest
          path: engine/nextest.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  engine-test:
    needs: engine-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: rust cargo:cargo-nextest
          area: engine-test
      - uses: actions/download-artifact@v8
        with:
          name: engine-nextest
          path: engine
      # Same workspace suite as engine:test, without compiling it again.
      - name: mise run ci:engine-test-archive
        run: mise run ci:engine-test-archive
        timeout-minutes: 6
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  engine-eval:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Same dev profile as engine-build, so they share one Rust cache.
      - uses: ./.github/actions/setup-engine
        with:
          cache-key: build
      - name: mise run engine:eval
        run: mise run engine:eval
        timeout-minutes: 12
      # E10-06: a fingerprinted engine change without refreshed evals/promotion/live-report.json
      # would ship an engine that closes every live AI feature. Ready PRs, main and merge queues
      # fail here (inside ci-ok) when the evidence is stale, missing or leaves a launch task
      # closed; drafts only warn. The message names the refresh commands (evals/README.md).
      - name: mise run engine:evidence
        run: mise run engine:evidence ${{ inputs.tier == 'full' && '-- --require-launch' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-reports
          path: evals/reports
          retention-days: 90
          if-no-files-found: ignore
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  api-integration-a:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The task starts and removes Postgres 18 via testcontainers; Docker is preinstalled.
    env:
      API_TEST_PACKAGES: ./internal/backup/... ./internal/social/... ./internal/sharing/...
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-api
      - name: mise run api:test-integration
        run: mise run api:test-integration
        timeout-minutes: 12
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/api-integration.xml
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  api-integration-b:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_TEST_PACKAGES: ./internal/notes/... ./internal/voice/... ./internal/narration/... ./internal/lessontest/... ./internal/characters/... ./internal/credits/... ./internal/maintenance/... ./internal/worker/...
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-api
      - name: mise run api:test-integration
        run: mise run api:test-integration
        timeout-minutes: 12
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/api-integration.xml
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  api-integration-c:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_TEST_PACKAGES: ./internal/store/... ./internal/pricing/... ./internal/accounts/... ./internal/courses/... ./internal/player/... ./internal/eval/... ./internal/gamification/... ./internal/chat/... ./internal/steering/... ./internal/retention/...
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-api
      - name: mise run api:test-e2e
        run: mise run api:test-e2e
        timeout-minutes: 8
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/api-e2e.xml
      - name: mise run api:test-integration
        run: mise run api:test-integration
        timeout-minutes: 12
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/api-integration.xml
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  restore-drill:
    needs: changes
    if: inputs.tier == 'full' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Starts disposable Postgres 18, RustFS and Redis via testcontainers; Docker is preinstalled.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-api
      - name: mise run api:restore-drill-ci
        run: mise run api:restore-drill-ci
        timeout-minutes: 10
        env:
          GOTESTSUM_JUNITFILE: ${{ runner.temp }}/junit/restore-drill.xml
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  playwright:
    name: playwright-${{ matrix.shard }}
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-client
      # api:pricing-e2e-server runs through `go run`.
      - uses: ./.github/actions/setup-api
        with:
          tools: go
          area: pricing-e2e
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: mise run ci:playwright-deps
        run: mise run ci:playwright-deps
        timeout-minutes: 3
      - name: mise run client:e2e-setup
        if: steps.browsers.outputs.cache-hit != 'true'
        run: mise run client:e2e-setup
        timeout-minutes: 3
      # client:e2e depends on client:build (with the tracer env the tests need).
      - name: mise run client:e2e (shard ${{ matrix.shard }}/3)
        run: mise run client:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/3
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/client/playwright-report
            apps/client/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  tauri:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-client
        with:
          tauri: 'true'
          cache-key: build
      - name: mise run client:tauri-build
        run: mise run client:tauri-build
        timeout-minutes: 18
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  images:
    needs: changes
    if: inputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: services/api
            file: services/api/Dockerfile
          - image: engine
            context: .
            file: engine/Dockerfile
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs[matrix.image] == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        if: needs.changes.outputs[matrix.image] == 'true'
      - name: mise run ci:free-disk
        if: needs.changes.outputs[matrix.image] == 'true'
        run: mise run ci:free-disk
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs[matrix.image] == 'true'
      - name: Build ${{ matrix.image }} image (BuildKit gha cache)
        uses: docker/build-push-action@v7
        if: needs.changes.outputs[matrix.image] == 'true'
        timeout-minutes: 20
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Summary
        if: always() && needs.changes.outputs[matrix.image] == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  # E10-06 ready gate: a pinned, task-stratified, budget-bounded live sample when OPENROUTER_API_KEY,
  # HF_TOKEN, ELEVENLABS_API_KEY and ELEVENLABS_VOICE_ID exist. Without them the eval CLI records an
  # explicit missing_secrets report (90-day artifact) and exits 0, so no live pass is fabricated (the
  # engine-eval evidence check still fails a ready PR whose committed evidence is stale). Cost: about
  # $0.003 OpenRouter and about 70 ElevenLabs characters per full 32-case run; EVAL_BUDGET_USD halts at $0.50.
  engine-eval-live:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: mise run ci:require-secrets
        id: credentials
        run: mise run ci:require-secrets -- 'live eval (status missing_secrets, live promotion disabled)'
        env:
          REQUIRED_SECRETS: OPENROUTER_API_KEY HF_TOKEN ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      - uses: ./.github/actions/setup-engine
        with:
          cache-key: build
      - name: mise run engine:evidence
        run: mise run engine:evidence
      - name: mise run engine:eval-live
        run: mise run engine:eval-live
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HF_GOLDEN_DATASET: ${{ vars.HF_GOLDEN_DATASET || 'datamonsterr/duolify-golden' }}
          # Pinned revision (evals/pinned-datasets.toml); a repo variable may pin a newer reviewed one.
          HF_GOLDEN_REVISION: ${{ vars.HF_GOLDEN_REVISION || 'd902ce8cfacc2abf8d585930e2a15d471515b07a' }}
          # 90 = every case of the pinned revision; a smaller sample cannot cover all 17 tasks.
          EVAL_SAMPLE_LIMIT: ${{ vars.EVAL_SAMPLE_LIMIT || '90' }}
          EVAL_BUDGET_USD: ${{ vars.EVAL_BUDGET_USD || '0.50' }}
      - name: mise run engine:gate
        if: always()
        run: mise run engine:gate evals/reports/latest.json
      - name: mise run engine:promote
        # A passing live run of this commit yields candidate evidence; committing it is a reviewed change.
        if: success() && steps.credentials.outputs.enabled == 'true'
        run: mise run engine:promote ../evals/reports/latest.json ../evals/reports/promotion-candidate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-live-reports
          path: evals/reports
          retention-days: 90
          if-no-files-found: warn
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  infra-plan:
    needs: changes
    if: inputs.tier == 'full' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: go node pnpm railway
          area: infra-plan
      - name: mise run infra:validate-plan
        run: mise run infra:validate-plan
      - name: mise run ci:require-secrets
        id: credentials
        run: mise run ci:require-secrets -- 'Railway plan'
        env:
          REQUIRED_SECRETS: RAILWAY_TOKEN
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: mise run infra:plan
        if: steps.credentials.outputs.enabled == 'true'
        run: mise run infra:plan
        timeout-minutes: 6
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  # Brings the production-shaped self-hosted stack (infra/deploy) up from freshly built
  # images, then smoke tests it and runs a real backup and restore drill.
  selfhost:
    needs: changes
    if: inputs.tier == 'full' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: mise run infra:selfhost-up
        timeout-minutes: 40
      - run: mise run infra:selfhost-smoke
        timeout-minutes: 3
      - run: mise run infra:selfhost-backup
        timeout-minutes: 6
      - run: mise run infra:selfhost-restore-drill
        timeout-minutes: 5
      - name: Stack logs
        if: failure()
        run: mise run infra:selfhost-logs
      - name: Stop stack
        if: always()
        run: mise run infra:selfhost-down
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  # Production overlay (infra/deploy/compose.prod.yml): plan check, then API x2 + WAL archiving on
  # local RustFS with the e2e smoke, PITR drill, Redis cold start and DR copy tests.
  overlay:
    needs: changes
    if: inputs.tier == 'full' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: mise run infra:deploy-plan
        timeout-minutes: 3
      - run: mise run infra:overlay-e2e
        timeout-minutes: 30
      - run: mise run infra:overlay-ca
        timeout-minutes: 20
      - run: mise run infra:overlay-pitr
        timeout-minutes: 10
      - run: mise run infra:overlay-redis
        timeout-minutes: 8
      - run: mise run infra:overlay-dr
        timeout-minutes: 8
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  # Full-stack flow suite (openspec/changes/fullstack-flow-e2e): the real web client on the
  # disposable infra/e2e stack, mock engine provider (no paid calls). Uploads per-flow
  # screenshots and flows.json. Required by ci-ok since it passed on two consecutive runs
  # (PR #320).
  playwright-stack:
    needs: changes
    if: inputs.tier == 'full' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-client
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: mise run ci:playwright-deps
        run: mise run ci:playwright-deps
        timeout-minutes: 3
      - name: mise run client:e2e-setup
        if: steps.browsers.outputs.cache-hit != 'true'
        run: mise run client:e2e-setup
        timeout-minutes: 3
      - name: mise run client:e2e-stack-up
        run: mise run client:e2e-stack-up
        timeout-minutes: 40
      - name: mise run client:e2e-stack
        run: mise run client:e2e-stack
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-flows
          path: |
            apps/client/test-results/stack-flows
            apps/client/test-results/stack
            apps/client/playwright-report-stack
          if-no-files-found: ignore
          retention-days: 14
      - name: mise run client:e2e-stack-logs
        if: failure()
        run: mise run client:e2e-stack-logs
      - name: mise run client:e2e-stack-down
        if: always()
        run: mise run client:e2e-stack-down
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary

  mobile-android:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    # Advisory until Android has three consecutive green runs; do not gate ci-ok.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: node pnpm rust
          area: mobile-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: mobile-gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/client/src-tauri/Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
          shared-key: mobile-android
      - run: mise run client:android-free-disk
      - run: mise run client:install
      - run: mise run client:android-prerequisites
      - run: mise run client:mobile-driver-install
      - run: mise run client:e2e-stack-up
        env:
          E2E_STACK_BIND_ADDRESS: 0.0.0.0
          E2E_STACK_ALLOWED_ORIGINS: http://localhost:18471,http://tauri.localhost,https://tauri.localhost
      - run: mise run client:android-build
        env:
          MOBILE_E2E: '1'
          VITE_API_URL: http://10.0.2.2:18471
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: mise run client:android-device-test
      - run: mise run client:e2e-stack-down
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-screens-android
          path: apps/client/mobile-screens
          if-no-files-found: warn

  mobile-ios:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    # Advisory until device coverage is stable; do not gate ci-ok.
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: node pnpm rust
          area: mobile-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
          shared-key: mobile-ios
      - run: mise run client:install
      - run: mise run client:mobile-driver-install
      - run: mise run client:ios-build
      - run: mise run client:ios-device-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-screens-ios
          path: apps/client/mobile-screens
          if-no-files-found: warn

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - repo-lint
      - proto
      - api
      - client-web
      - infra
      - engine-lint
      - client-native
      - engine-build
      - engine-test
      - engine-eval
      - api-integration-a
      - api-integration-b
      - api-integration-c
      - restore-drill
      - playwright
      - tauri
      - images
      - engine-eval-live
      - infra-plan
      - selfhost
      - overlay
      - playwright-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: mise run ci:aggregate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: mise run ci:aggregate
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary
