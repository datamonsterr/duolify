name: pr-ready

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft && 'ready-inactive' || 'active' }}
  cancel-in-progress: true

jobs:
  # Only the active caller instantiates ci-ok, keeping its check name unambiguous.
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/_checks.yml
    with:
      tier: full
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Publishing is a main-only follow-up after ci-ok. A publish failure also blocks deploy-dev.
  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-linux-xl
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: services/api
            file: services/api/Dockerfile
          - image: engine
            context: .
            file: engine/Dockerfile
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        timeout-minutes: 20
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary
