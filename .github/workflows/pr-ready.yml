name: pr-ready

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

# A newer push to a pull request supersedes the older run. A push to main is never cancelled: it builds
# and publishes the images the automatic deploy needs, and with frequent merges a shared group would
# cancel (or replace while pending) each run before it published. So each commit on main gets its own group.
concurrency:
  group: pr-checks-${{ github.event_name == 'push' && format('main-{0}', github.sha) || github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft && 'ready-inactive' || 'active' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only the active caller instantiates ci-ok, keeping its check name unambiguous.
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/_checks.yml
    with:
      tier: full
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Publishing is a main-only follow-up after ci-ok. A publish failure also blocks deploy-dev.
  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: services/api
            file: services/api/Dockerfile
            target: api
          - image: worker
            context: services/api
            file: services/api/Dockerfile
            target: worker
          - image: backup-init
            context: services/api
            file: services/api/Dockerfile
            target: backup-init
          - image: engine
            context: .
            file: engine/Dockerfile
            target: ''
          # Caddy edge + static web client for the self-hosted stack (infra/deploy).
          - image: web
            context: .
            file: apps/client/Dockerfile
            target: web
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: mise run ci:free-disk
        run: mise run ci:free-disk
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        timeout-minutes: 20
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev
          # Public PostHog project key and host for the web client (read at build time); unused by other images.
          build-args: |
            VITE_POSTHOG_KEY=${{ matrix.image == 'web' && secrets.POSTHOG_API_KEY || '' }}
            VITE_POSTHOG_HOST=${{ matrix.image == 'web' && secrets.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # The pushed digest is what deploy-vm deploys (image@sha256:...), not the mutable sha-<commit> tag.
      - name: Record image digest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          mkdir -p digests
          printf '%s\n' "$IMAGE_REF" >"digests/$IMAGE_NAME"
          echo "Pushed \`$IMAGE_REF\`" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary
