name: deploy-dev

on:
  workflow_run:
    workflows: [pr-ready]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: namespace-profile-datamonster01
    timeout-minutes: 20
    environment: dev
    env:
      MISE_AUTO_INSTALL: 'false'
      DUOLIFY_ENV: dev
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the tested main commit; manual dispatch is limited to main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: node pnpm railway
          area: infra
      - name: Require dev credentials
        env:
          HAVE_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          if [[ "$HAVE_TOKEN" != true ]]; then
            echo '::error::Set RAILWAY_TOKEN in the dev environment before deploying.'
            exit 1
          fi
      - name: Deploy development environment
        run: mise run infra:deploy-dev
        timeout-minutes: 15
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: mise run ci:summary
