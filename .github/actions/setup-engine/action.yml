name: Set up engine
description: mise Rust, protoc and nextest with the engine workspace cache and extra disk space.
inputs:
  cache-key:
    description: Rust cache namespace; jobs that compile the same profile share one.
    default: build
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-tools
      with:
        tools: rust protoc cargo:cargo-nextest
        area: engine
    - name: mise run ci:free-disk
      shell: bash
      run: mise run ci:free-disk
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: engine -> target
        shared-key: engine-${{ inputs.cache-key }}
