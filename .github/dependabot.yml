version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /engine
      - /apps/client/src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ['*']
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (client:lint-web fails on #2 and #224).
      # Remove once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
