["client:install"]
description = "Install client dependencies"
dir = "{{config_root}}"
run = "pnpm install --frozen-lockfile"

["client:lint"]
description = "Check client formatting, types and lint"
dir = "{{config_root}}/apps/client"
depends = ["client:lint-web"]
run = ["cargo fmt --manifest-path src-tauri/Cargo.toml -- --check", "cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings"]

["client:test"]
description = "Run client tests"
dir = "{{config_root}}/apps/client"
depends = ["client:test-web"]
run = "cargo test --manifest-path src-tauri/Cargo.toml"

["client:build"]
description = "Build client web assets"
dir = "{{config_root}}/apps/client"
run = ["pnpm exec vitest run src/features/pricing/catalogue-boundary.test.ts", "pnpm build"]

["client:e2e-setup"]
description = "Install browser for end-to-end tests"
dir = "{{config_root}}/apps/client"
run = "pnpm exec playwright install chromium"

["client:e2e"]
description = "Run end-to-end tests against the web build"
depends = ["client:build"]
dir = "{{config_root}}/apps/client"
run = "pnpm exec playwright test"

["client:tauri-build"]
description = "Build Tauri debug application"
dir = "{{config_root}}/apps/client"
run = "pnpm tauri build --debug --no-bundle"

["client:dev"]
description = "Run Tauri development application"
dir = "{{config_root}}/apps/client"
run = "pnpm tauri dev"

["client:lint-web"]
description = "Check client web formatting, types and lint without native prerequisites"
dir = "{{config_root}}/apps/client"
run = ["pnpm exec eslint .", "pnpm exec prettier --check .", "pnpm exec tsc --noEmit"]

["client:test-web"]
description = "Run client web unit and integration tests without native prerequisites"
dir = "{{config_root}}/apps/client"
run = "pnpm exec vitest run"

["client:format-pricing"]
description = "Format pricing source and shared client integration files"
dir = "{{config_root}}/apps/client"
run = "pnpm exec prettier --write src/features/pricing src/lib/analytics.ts src/lib/api.ts src/App.tsx src/test/apply_design_tokens_to_a_real_course_card.integration.test.tsx e2e/pricing-e12-01.spec.ts e2e/pricing-e12-02.spec.ts e2e/pricing-e12-03.spec.ts e2e/pricing-e12-06.spec.ts e2e/design-e13-01.spec.ts playwright.config.ts"

["client:format-accounts"]
description = "Format email sign-in and its shared integration boundaries"
dir = "{{config_root}}/apps/client"
run = ["pnpm exec prettier --write src/features/accounts src/lib/analytics.ts src/App.tsx e2e/accounts* e2e/servers.ts e2e/lesson.spec.ts e2e/design-e13-01.spec.ts e2e/pricing-e12-01.spec.ts playwright.config.ts playwright.guided.config.ts", "cargo fmt --manifest-path src-tauri/Cargo.toml"]
["client:format-shell"]
description = "Format responsive shell sources and acceptance tests"
dir = "{{config_root}}/apps/client"
run = "pnpm exec prettier --write src/features/shell src/features/lesson-player/LessonPlayer.tsx src/lib/analytics.ts src/App.tsx src/LearnPath.tsx src/styles.css src/test/learn-path.test.tsx src/test/implement_responsive_navigation_shells.integration.test.tsx src/features/design/implement_responsive_navigation_shells.test.tsx e2e/design-e13-02.spec.ts"
