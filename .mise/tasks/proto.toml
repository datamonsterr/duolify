["proto:lint"]
description = "Lint and check formatting of the private gRPC contract"
dir = "{{config_root}}/proto"
run = ["buf lint", "buf format --diff --exit-code"]

["proto:gen"]
description = "Generate pinned Go protobuf and gRPC bindings"
dir = "{{config_root}}"
run = "buf generate --template buf.gen.yaml"

["proto:breaking"]
description = "Check wire compatibility against main when it has a contract"
dir = "{{config_root}}"
run = '''
set -eu
proto_base_ref="${PROTO_BREAKING_REF:-main}"
git rev-parse --verify "$proto_base_ref" >/dev/null
if [ -z "$(git ls-tree -r --name-only "$proto_base_ref" -- proto | sed -n '/\.proto$/p')" ]; then
  echo "Skipping breaking check: $proto_base_ref has no proto contract"
  exit 0
fi
buf breaking proto --against ".git#ref=${proto_base_ref},subdir=proto"
'''

["proto:format"]
description = "Format private gRPC definitions"
dir = "{{config_root}}/proto"
run = "buf format -w"
