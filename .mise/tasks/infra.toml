["infra:up"]
description = "Start the local stack and wait for healthchecks"
run = "docker compose up -d --wait"

["infra:deps"]
description = "Start Postgres, Redis, RustFS S3 and scoped storage initialization"
# --wait treats an explicitly selected one-shot exit as a failure when no
# selected service depends on its completion. Run the initializer separately.
run = ["docker compose up -d --wait postgres redis objectstore", "docker compose run --rm --no-deps s3-init", "docker compose run --build --rm --no-deps backup-init"]

["infra:down"]
description = "Stop all profiles; retain named data volumes"
run = "docker compose --profile '*' down --remove-orphans"

["infra:logs"]
description = "Follow local stack logs (all profiles)"
run = "docker compose --profile '*' logs --follow --tail 100"

["infra:lint"]
description = "Validate Compose, lint every Dockerfile and infra shell script"
run = '''
set -eu
docker compose config -q
git ls-files --cached --others --exclude-standard -z -- '*Dockerfile' | xargs -0 hadolint
shellcheck infra/backup/restore-drill.sh infra/backup/scheduled-restore-drill.sh infra/hooks/*.sh infra/s3/*.sh
docker compose --profile observability run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
'''

["infra:test"]
description = "Verify healthy local dependencies"
depends = ["infra:deps"]
run = ["docker compose exec -T postgres pg_isready -U duolify -d duolify", "docker compose exec -T redis redis-cli ping", "docker compose exec -T objectstore curl --fail --silent http://localhost:9000/health/ready"]

["infra:build"]
description = "Build API, worker, local initializer and engine container images"
run = "docker compose --profile workers build api engine worker backup-init"

["infra:build-worker"]
description = "Build pinned Postgres/age worker and local IAM initializer images"
run = "docker compose --profile workers build worker backup-init"

["infra:plan"]
description = "Preview Railway IaC for duolify/dev without applying"
run = ["npm ci --prefix .railway --ignore-scripts", "railway link --project duolify --environment dev", "railway config plan"]

["infra:validate-plan"]
description = "Validate git-backed Railway environment definitions (dev, staging, prod) and produce plan evidence"
run = "node .railway/plan.mjs --all | go run -C services/api ./cmd/api admin infra validate"

["infra:deploy-dev"]
description = "Review and apply Railway IaC to duolify/dev only (may incur costs)"
run = ["npm ci --prefix .railway --ignore-scripts", "railway link --project duolify --environment dev", "railway config apply"]

["infra:deploy-staging"]
description = "Staging deployment release gate (gated on E11-07; disabled in AFK ticket)"
run = '''
echo "ERROR: Staging live deployment is disabled in AFK tickets. Requires E11-07 owner approval." >&2
exit 1
'''

["infra:deploy-prod"]
description = "Production deployment release gate (gated on E11-07; disabled in AFK ticket)"
run = '''
echo "ERROR: Production live deployment is disabled in AFK tickets. Requires E11-07 owner approval." >&2
exit 1
'''

["infra:restore-drill"]
description = "Restore an anonymized custom-format dump into disposable Postgres"
usage = 'arg "<dump>" help="Path to an anonymized custom-format pg_dump archive"'
run = 'bash infra/backup/restore-drill.sh "${usage_dump?}"'

["infra:restore-drill-scheduled"]
description = "Scheduled anonymized restore drill of the newest backup; skips with a notice without owner credentials"
run = 'bash infra/backup/scheduled-restore-drill.sh'

[dev]
description = "Start dependencies and print the three local development commands"
depends = ["infra:deps"]
run = '''
printf '%s\n' 'In separate terminals:' 'mise run api:migrate && mise run api:run' 'mise run engine:run' 'mise run client:dev'
'''
