["infra:up"]
description = "Start the local stack and wait for healthchecks"
run = "docker compose up -d --wait"

["infra:deps"]
description = "Start Postgres, Redis, RustFS S3 and scoped storage initialization"
# --wait treats an explicitly selected one-shot exit as a failure when no
# selected service depends on its completion. Run the initializer separately.
run = ["docker compose up -d --wait postgres redis objectstore", "docker compose run --rm --no-deps s3-init", "docker compose run --build --rm --no-deps backup-init"]

["infra:down"]
description = "Stop all profiles; retain named data volumes"
run = "docker compose --profile '*' down --remove-orphans"

["infra:logs"]
description = "Follow local stack logs (all profiles)"
run = "docker compose --profile '*' logs --follow --tail 100"

["infra:lint"]
description = "Validate Compose, lint every Dockerfile and infra shell script"
run = '''
set -eu
docker compose config -q
git ls-files --cached --others --exclude-standard -z -- '*Dockerfile' | xargs -0 hadolint
shellcheck infra/backup/restore-drill.sh infra/backup/scheduled-restore-drill.sh infra/hooks/*.sh infra/s3/*.sh infra/load/*.sh infra/deploy/*.sh infra/deploy/walship/*.sh
docker compose --file infra/deploy/compose.yml --env-file infra/deploy/.env.example config -q
docker compose --file infra/deploy/compose.yml --file infra/deploy/compose.prod.yml --env-file infra/deploy/.env.prod.example --profile '*' config -q
docker run --rm --network none -v "$PWD/infra/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
docker compose --profile observability run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
docker run --rm --network none --entrypoint promtool -v "$PWD/infra/observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro" -v "$PWD/infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro" prom/prometheus:v3.8.0 check config /etc/prometheus/prometheus.yml
docker run --rm --network none --entrypoint promtool -v "$PWD/infra/observability:/t:ro" -w /t prom/prometheus:v3.8.0 test rules alerts.test.yml
'''

["infra:test"]
description = "Verify healthy local dependencies"
depends = ["infra:deps"]
run = ["docker compose exec -T postgres pg_isready -U duolify -d duolify", "docker compose exec -T redis redis-cli ping", "docker compose exec -T objectstore curl --fail --silent http://localhost:9000/health/ready"]

["infra:build"]
description = "Build API, worker, local initializer and engine container images"
run = "docker compose --profile workers build api engine worker backup-init"

["infra:build-worker"]
description = "Build pinned Postgres/age worker and local IAM initializer images"
run = "docker compose --profile workers build worker backup-init"

["infra:plan"]
description = "Preview Railway IaC for duolify/dev without applying"
run = ["npm ci --prefix .railway --ignore-scripts", "railway link --project duolify --environment dev", "railway config plan"]

["infra:validate-plan"]
description = "Validate git-backed Railway environment definitions (dev, staging, prod) and produce plan evidence"
run = "node .railway/plan.mjs --all | go run -C services/api ./cmd/api admin infra validate"

["infra:deploy-dev"]
description = "Review and apply Railway IaC to duolify/dev only (may incur costs)"
run = ["npm ci --prefix .railway --ignore-scripts", "railway link --project duolify --environment dev", "railway config apply"]

["infra:deploy-staging"]
description = "Staging deployment release gate (gated on E11-07; disabled in AFK ticket)"
run = '''
echo "ERROR: Staging live deployment is disabled in AFK tickets. Requires E11-07 owner approval." >&2
exit 1
'''

["infra:deploy-prod"]
description = "Production deployment release gate (gated on E11-07; disabled in AFK ticket)"
run = '''
echo "ERROR: Production live deployment is disabled in AFK tickets. Requires E11-07 owner approval." >&2
exit 1
'''

["infra:load-baseline"]
description = "Load baseline on a throwaway compose stack: k6 1k-DAU read mix (public + authenticated) plus a 10-minute Tutor chat SSE stream through the API with a mock Engine behind it (READ_RPS, READ_DURATION, SSE_SECONDS, SSE_HEARTBEAT_INTERVAL, MAX_GAP_SECONDS)"
run = 'bash infra/load/run.sh'

["infra:load-baseline-test"]
description = "E2E: short load-baseline variant (read mix + Tutor chat stream through the API) against a throwaway compose stack"
run = 'bash infra/load/baseline.e2e.sh'

["infra:restore-drill"]
description = "Restore an anonymized custom-format dump into disposable Postgres"
usage = 'arg "<dump>" help="Path to an anonymized custom-format pg_dump archive"'
run = 'bash infra/backup/restore-drill.sh "${usage_dump?}"'

["infra:restore-drill-scheduled"]
description = "Scheduled anonymized restore drill of the newest backup; skips with a notice without owner credentials"
run = 'bash infra/backup/scheduled-restore-drill.sh'

[dev]
description = "Start dependencies and print the three local development commands"
depends = ["infra:deps"]
run = '''
printf '%s\n' 'In separate terminals:' 'mise run api:migrate && mise run api:run' 'mise run engine:run' 'mise run client:dev'
'''

["infra:selfhost-up"]
description = "Self-hosted stack: create infra/deploy/.env if missing, build or pull images, start and wait for health"
run = "bash infra/deploy/selfhost.sh up"

["infra:selfhost-down"]
description = "Self-hosted stack: stop all services; named volumes (data) are kept"
run = "bash infra/deploy/selfhost.sh down"

["infra:selfhost-logs"]
description = "Self-hosted stack: follow logs (optionally for given services)"
usage = 'arg "[service]..." var=#true help="Services to follow; default all"'
run = 'bash infra/deploy/selfhost.sh logs ${usage_service:-}'

["infra:selfhost-smoke"]
description = "Self-hosted stack: health, proxy routing, CORS, unbuffered SSE and web client checks"
run = "bash infra/deploy/selfhost.sh smoke"

["infra:selfhost-backup"]
description = "Self-hosted stack: ensure today's encrypted Postgres backup exists in the local backup bucket"
run = "bash infra/deploy/selfhost.sh backup"

["infra:selfhost-restore-drill"]
description = "Self-hosted stack: decrypt the newest backup into a throwaway Postgres and verify it"
run = "bash infra/deploy/selfhost.sh restore-drill"

["infra:deploy-plan"]
description = "Production overlay: static plan check (private Engine, direct Postgres, WAL archiving, backup env, DR job, off-site backup location, alerts) plus its unit tests"
run = ["bash infra/deploy/test-deploy-plan.sh", "bash infra/deploy/test-deploy.sh", "bash infra/deploy/walship/test-walship.sh", "bash infra/deploy/walship/test-archive-wal.sh", "bash infra/deploy/test-backup-lifecycle.sh", "bash infra/deploy/deploy-plan.sh"]

["infra:backup-lifecycle"]
description = "Apply the wal/ + base/ retention lifecycle to the backup bucket (admin key from env: BACKUP_ADMIN_S3_ACCESS_KEY_ID/SECRET_ACCESS_KEY plus BACKUP_S3_ENDPOINT/REGION/BUCKET; needs the aws CLI; run from an admin machine, not the VM)"
run = "bash infra/deploy/backup-lifecycle.sh apply"

["infra:backup-preflight"]
description = "Verify the backup bucket: versioned, lifecycle matches the policy (WAL outlives base, noncurrent expiry) and a base newer than the PITR window exists (same env as infra:backup-lifecycle)"
run = "bash infra/deploy/backup-lifecycle.sh verify --require-base"

["infra:overlay-lifecycle"]
description = "Production overlay: apply and verify the backup-bucket lifecycle against local RustFS"
run = "bash infra/deploy/overlay-tests.sh lifecycle"

["infra:overlay-rolling"]
description = "Production overlay: stop each API instance in turn (docker stop, as deploy.sh does) under parallel GET+POST load plus slow in-flight requests (no failed request), then a flaky-replica retry check"
run = "bash infra/deploy/overlay-tests.sh rolling"

["infra:overlay-sse"]
description = "Production overlay: a mostly idle SSE stream (10-15 s silences, 165 s total) survives the Caddy /v1 proxy path unbuffered"
run = "bash infra/deploy/overlay-tests.sh sse"

["infra:overlay-e2e"]
description = "Production overlay: bring up API x2, Engine, Redis, Postgres with WAL archiving on local RustFS; smoke and WAL shipping"
run = "bash infra/deploy/overlay-tests.sh e2e"

["infra:overlay-pitr"]
description = "Production overlay: PITR drill from base backup plus archived WAL on a throwaway Postgres"
run = "bash infra/deploy/overlay-tests.sh pitr"

["infra:overlay-redis"]
description = "Production overlay: flush and restart Redis; the stack keeps serving and state rebuilds from Postgres"
run = "bash infra/deploy/overlay-tests.sh redis"

["infra:overlay-dr"]
description = "Production overlay: the nightly DR copy keeps every object version"
run = "bash infra/deploy/overlay-tests.sh dr"

["infra:find-vm"]
description = "CI only: look up the Hetzner server named duolify-$DEPLOY_ENV (read-only Cloud API call) and write exists=true|false and host=<ipv4> to the step outputs; a missing VM is a notice, never a failure"
run = '''
set -eu
: "${HCLOUD_TOKEN:?}" "${DEPLOY_ENV:?}"
name="duolify-$DEPLOY_ENV"
out=${GITHUB_OUTPUT:-/dev/null}
body=$(curl -fsS --max-time 20 -H "Authorization: Bearer $HCLOUD_TOKEN" --get --data-urlencode "name=$name" https://api.hetzner.cloud/v1/servers)
ip=$(jq -r '.servers[0].public_net.ipv4.ip // empty' <<<"$body")
if [ -z "$ip" ]; then
  echo "::notice title=Skipped::Skipped deploy: no Hetzner server named $name exists yet."
  echo "- Skipped: deploy, no Hetzner server named $name." >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
  echo 'exists=false' >>"$out"
else
  echo 'exists=true' >>"$out"
  echo "host=$ip" >>"$out"
fi
'''

["infra:deploy-vm"]
description = "Deploy the tested commit to the VM over SSH (CI only; needs DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_SHA and the digests/<image> files from the image build)"
run = '''
set -eu
: "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}" "${DEPLOY_SHA:?}"
path=${DEPLOY_PATH:-/opt/duolify}
install -d -m 700 "$HOME/.ssh"
(umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/deploy_key")
printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts $DEPLOY_USER@$DEPLOY_HOST"
git archive "$DEPLOY_SHA" infra | $ssh_cmd "mkdir -p '$path' && tar -x -C '$path'"
# One digest-pinned reference per image, from the image build's artifacts (digests/<image>).
images=''
for name in api worker engine web backup-init; do
  ref=$(cat "${DEPLOY_DIGESTS_DIR:-digests}/$name")
  [[ $ref =~ ^[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: $name is not a digest-pinned reference: '$ref'" >&2; exit 1; }
  images="$images $name=$ref"
done
# shellcheck disable=SC2086 # references are validated above and again by deploy.sh
$ssh_cmd "cd '$path' && bash infra/deploy/deploy.sh 'sha-$DEPLOY_SHA'$images"
'''
