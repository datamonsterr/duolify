["api:lint"]
description = "Lint Go API, including integration tests"
dir = "{{config_root}}/services/api"
run = "golangci-lint run --build-tags integration ./..."

["api:test"]
env = { DUOLIFY_ENV = "development" }
description = "Run unit tests with the race detector"
dir = "{{config_root}}/services/api"
run = "gotestsum -- -race -count=1 ./internal/... ./migrations/..."

["api:test-e2e"]
env = { DUOLIFY_ENV = "development" }
description = "Run authenticated HTTP/gRPC and packaged worker backup/restore end-to-end tests"
depends = ["infra:build-worker"]
dir = "{{config_root}}/services/api"
run = "gotestsum -- -race -count=1 ./test/e2e/..."

["api:test-integration"]
env = { DUOLIFY_ENV = "development" }
description = "Test migrations, store and queue against Postgres 18 (Docker)"
dir = "{{config_root}}/services/api"
run = "gotestsum -- -race -count=1 -tags integration {{env.API_TEST_PACKAGES | default(value='./internal/store/... ./internal/backup/... ./internal/pricing/... ./internal/accounts/... ./internal/courses/... ./internal/credits/... ./internal/player/... ./internal/eval/... ./internal/lessontest/... ./internal/notes/... ./internal/characters/... ./internal/gamification/... ./internal/chat/... ./internal/social/...')}}"

["api:build"]
description = "Build the statically linked API binary"
dir = "{{config_root}}/services/api"
env = { CGO_ENABLED = "0" }
run = ["go build -trimpath -o bin/api ./cmd/api", "go build -trimpath -o bin/backup-init ./cmd/backup-init", "go build -trimpath -o bin/backup-expire ./cmd/backup-expire"]

["api:run"]
env = { DUOLIFY_ENV = "{{env.DUOLIFY_ENV | default(value='development')}}" }
description = "Run the HTTP API"
dir = "{{config_root}}/services/api"
run = "go run ./cmd/api serve"

["api:migrate"]
description = "Apply embedded Goose and River migrations"
dir = "{{config_root}}/services/api"
run = "go run ./cmd/api migrate"

["api:generate"]
description = "Regenerate pinned sqlc queries"
dir = "{{config_root}}/services/api"
run = "go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate"

["api:pricing-e2e-server"]
description = "Serve pricing from a freshly migrated disposable Postgres for Playwright"
dir = "{{config_root}}/services/api"
env = { DUOLIFY_ENV = "development", LESSON_TEST_TRACER_ENABLED = "{{env.LESSON_TEST_TRACER_ENABLED | default(value='true')}}" }
run = "go run ./test/pricingserver"

["api:pricing-activate-interim"]
description = "Draft, submit, and approve interim ADR 0012 design chat pricing in dev/test via admin CLI"
dir = "{{config_root}}/services/api"
env = { DUOLIFY_ENV = "development" }
run = """
go run ./cmd/api admin pricing draft --actor "${PRICING_ADMIN_ID:-00000000-0000-4000-8000-000000000001}" --reason "interim ADR 0012 design chat pricing" --config internal/pricing/fixtures/usd_interim_design_chat.json
go run ./cmd/api admin pricing submit --version usd-interim-design-chat --actor "${PRICING_ADMIN_ID:-00000000-0000-4000-8000-000000000001}" --reason "submit interim design chat pricing"
go run ./cmd/api admin pricing approve --version usd-interim-design-chat --actor "${PRICING_APPROVER_ID:-00000000-0000-4000-8000-000000000002}" --reason "approve interim design chat pricing under ADR 0012"
"""

["api:format"]
description = "Format Go source"
dir = "{{config_root}}/services/api"
run = "gofmt -w internal/gamification internal/chat internal/player internal/accounts internal/backuptest internal/backup internal/credits internal/worker internal/telemetry internal/analytics internal/courses internal/engine internal/pricing internal/lessontest internal/notes internal/httpapi/router.go internal/httpapi/middleware.go cmd/api/main.go test/pricingserver test/e2e"
