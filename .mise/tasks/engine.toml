["engine:lint"]
dir = "engine"
run = ["cargo fmt --all -- --check", "cargo clippy --workspace --all-targets -- -D warnings"]
["engine:test"]
env = { ENGINE_PROVIDER_MODE = "mock", EVAL_SAMPLE_LIMIT = "0" }
dir = "engine"
run = "cargo nextest run --workspace"
["engine:build"]
dir = "engine"
run = "cargo build --workspace"
["engine:run"]
dir = "engine"
run = "cargo run -p engine-server --bin duolify-engine"
["engine:eval"]
env = { ENGINE_PROVIDER_MODE = "mock", EVAL_SAMPLE_LIMIT = "0" }
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- --offline --provider mock"
["engine:eval-live"]
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- --mode ready --provider live --judge"

["engine:gate"]
description = "Verify promotion gate against an evaluation report"
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- gate"

["engine:format"]
description = "Format engine workspace"
dir = "engine"
run = "cargo fmt --all"

["engine:eval-golden"]
description = "Live eval of the pinned golden revision (local bytes verified against evals/pinned-datasets.toml) on the production route, all cases, no judge; needs OPENROUTER_API_KEY"
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- --provider live --data ../evals/datasets/duolify-golden/golden.jsonl --dataset datamonsterr/duolify-golden --revision d902ce8cfacc2abf8d585930e2a15d471515b07a --limit 0"

["engine:promote"]
description = "Record a passing live eval report of this build as the promotion evidence a deployed engine embeds (evals/promotion/live-report.json)"
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- promote"

["engine:evidence"]
description = "Print whether the embedded promotion evidence enables live AI features for this build"
dir = "engine"
run = "cargo run -p engine-eval --bin duolify-eval -- evidence"
["engine:compare"]
description = "Compare two live eval reports of the same cases (baseline then candidate prompt arm): tokens, cost, latency p50 and p95, pass rate, paired cost difference and the ADR 0025 economics gate verdict. Usage: mise run engine:compare -- <baseline.json> <candidate.json>"
dir = "engine"
run = "cargo run -q -p engine-eval --bin duolify-eval -- compare"
