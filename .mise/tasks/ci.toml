["ci:lint"]
description = "Lint GitHub workflows and CI shell scripts"
run = ["actionlint", "shellcheck scripts/ci/*.sh"]

["ci:api-integration-shards"]
description = "Verify API integration shards cover the default package list exactly once and all integration test directories"
run = "bash scripts/ci/api-integration-shards.sh"

["ci:migration-versions"]
description = "Reject duplicate Goose migration versions in services/api/migrations (with its test)"
run = ["bash scripts/ci/migration-versions.test.sh", "bash scripts/ci/migration-versions.sh"]

["ci:sql-casts"]
description = "Reject a cast column compared to a parameter (col::text = $1) in API Go and sqlc sources: it defeats the indexes"
run = "bash scripts/ci/sql-casts.sh"

["ci:openspec"]
description = "Validate all OpenSpec changes and specifications with the bootstrap CLI"
tools = { "npm:@fission-ai/openspec" = "1.3.1" }
env = { OPENSPEC_TELEMETRY = "0" }
run = "openspec validate --all --strict --no-interactive"

["ci:summary"]
description = "Write the job summary (status, duration, failing tests with file:line) and emit failure annotations"
run = "bash scripts/ci/job-summary.sh"

["ci:aggregate"]
description = "Fail the required check on failed, cancelled or unexpectedly skipped checks"
run = '''
set -eu
for result in ${RESULTS:?job results required}; do
  case "$result" in
    success|skipped) ;;
    *) echo "::error::CI dependency result: $result"; exit 1 ;;
  esac
done
# Path detection must have run successfully, even when all areas are skipped.
test "${CHANGES_RESULT:?changes result required}" = success
'''

["ci:pnpm-store"]
description = "Expose the configured pnpm store to actions/cache"
run = 'echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"'

["ci:playwright-apt-key"]
description = "Expose the runner image and Playwright version for the apt cache"
dir = "{{config_root}}/apps/client"
run = '''
set -eu
version=$(pnpm exec playwright --version | awk '{print $2}')
printf 'key=apt-playwright-%s-%s-%s-%s\n' "${ImageOS:?}" "${ImageVersion:?}" "$(uname -m)" "$version" >> "$GITHUB_OUTPUT"
'''

["ci:tauri-deps"]
description = "Install Tauri Linux prerequisites from the runner-specific apt cache"
run = "bash scripts/ci/tauri-deps.sh"

["ci:playwright-deps"]
description = "Install Chromium system dependencies, including on browser cache hits"
dir = "{{config_root}}/apps/client"
run = '''
set -eu

archives="$HOME/.cache/playwright-apt-archives"
lists="$HOME/.cache/playwright-apt-lists"
mkdir -p "$archives/partial"
apt_config=/etc/apt/apt.conf.d/99duolify-playwright-timeouts
printf '%s\n' \
  'Acquire::Retries "3";' \
  'Acquire::http::Timeout "30";' \
  'Acquire::https::Timeout "30";' \
  'APT::Sandbox::User "root";' \
  "Dir::Cache::archives \"$archives\";" | sudo tee "$apt_config" >/dev/null
trap 'sudo rm -f "$apt_config"' EXIT

# Playwright's dry run reports the packages apt would install. Try those from
# the runner-image-specific archive first, without updating package indexes.
missing=$(mktemp)
mirror_backup=$(mktemp)
mirror=/etc/apt/apt-mirrors.txt
if [ -f "$mirror" ]; then sudo cp "$mirror" "$mirror_backup"; fi
trap 'if [ -s "$mirror_backup" ]; then sudo cp "$mirror_backup" "$mirror"; fi; rm -f "$missing" "$mirror_backup"; sudo rm -f "$apt_config"; sudo chmod -R a+rX "$archives" "$lists" 2>/dev/null || true' EXIT
if [ -d "$lists" ]; then
  sudo cp -a "$lists/." /var/lib/apt/lists/
fi
if pnpm exec playwright install-deps --dry-run chromium >"$missing"; then
  cat "$missing"
  exit 0
fi
cat "$missing"
if grep -q '^Missing system dependencies (' "$missing"; then
  packages=$(awk '/^Missing system dependencies \([0-9]+\):$/ { collecting=1; next }
    collecting && /^[[:space:]]+[a-z0-9][a-z0-9+.:~-]*[[:space:]]*$/ { print $1 }' "$missing")
  if [ -z "$packages" ]; then
    echo 'Could not parse the missing Playwright packages.' >&2
    exit 1
  fi
  if sudo timeout --kill-after=10s 30s apt-get install -y --no-install-recommends --no-download $packages &&
    pnpm exec playwright install-deps --dry-run chromium; then
    exit 0
  fi
  echo 'Cached apt packages were incomplete; falling back to the network.'
fi

for attempt in 1 2 3; do
  # Run timeout as root: it can signal the entire process group, including apt.
  if sudo env "PATH=$PATH" "HOME=$HOME" timeout --kill-after=10s 120s pnpm exec playwright install-deps chromium; then
    mkdir -p "$lists"
    sudo cp -a /var/lib/apt/lists/. "$lists/"
    exit 0
  else
    status=$?
  fi

  if [ "$attempt" -lt 3 ]; then
    echo "Playwright system dependency installation failed (attempt $attempt/3, exit $status); retrying in 10 seconds" >&2
    # The hosted runner's regional mirror can be unusually slow. On retry,
    # use Ubuntu's primary archive rather than repeatedly hitting that mirror.
    if [ -s "$mirror_backup" ]; then
      printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee "$mirror" >/dev/null
    fi
    sleep 10
  fi
done

echo "Playwright system dependency installation failed after 3 attempts" >&2
exit "$status"
'''

["ci:proto-drift"]
description = "Reject changed, deleted and newly generated untracked protobuf bindings"
run = '''
git diff --exit-code
test -z "$(git ls-files --others --exclude-standard -- services/api/gen)"
'''

["ci:proto-main"]
description = "Create the local main ref required by proto:breaking"
run = '''
git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
# Checkout may already be on the tested main commit for a push run.
if [ "$(git branch --show-current)" != main ]; then
  git branch --force main refs/remotes/origin/main
fi
'''

["ci:engine-archive"]
description = "Build engine test binaries once for reuse by the test job"
dir = "{{config_root}}/engine"
run = "cargo nextest archive --locked --workspace --archive-file nextest.tar.zst"

["ci:engine-test-archive"]
description = "Run the engine:test workspace suite from the precompiled nextest archive"
dir = "{{config_root}}/engine"
run = "cargo nextest run --archive-file nextest.tar.zst --workspace-remap ."

["ci:matchers"]
description = "Register GitHub problem matchers (tsc, eslint, golangci-lint, rustc, actionlint) for annotations"
run = 'for f in .github/matchers/*.json; do echo "::add-matcher::$PWD/$f"; done'

["ci:free-disk"]
description = "Free about 25 GB on GitHub-hosted runners (no-op elsewhere)"
run = "bash scripts/ci/free-disk.sh"

["ci:require-secrets"]
description = "Set enabled=true|false from REQUIRED_SECRETS; notice and summary line when skipped"
run = "bash scripts/ci/require-secrets.sh"

["ci:failures"]
description = "Print failing jobs, steps, annotations and log tails for a PR number or run id (default: current branch PR). Usage: mise run ci:failures -- 123"
run = "bash scripts/ci/failures.sh"
