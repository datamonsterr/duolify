["ci:lint"]
description = "Lint GitHub workflows and CI shell scripts"
run = ["actionlint -color", "shellcheck scripts/ci/*.sh"]

["ci:api-integration-shards"]
description = "Verify API integration shards cover the default package list exactly once and all integration test directories"
run = "bash scripts/ci/api-integration-shards.sh"

["ci:openspec"]
description = "Validate all OpenSpec changes and specifications with the bootstrap CLI"
tools = { "npm:@fission-ai/openspec" = "1.3.1" }
env = { OPENSPEC_TELEMETRY = "0" }
run = "openspec validate --all --strict --no-interactive"

["ci:summary"]
description = "Write a job status and duration summary"
run = "bash scripts/ci/job-summary.sh"

["ci:aggregate"]
description = "Fail the required check on failed, cancelled or unexpectedly skipped checks"
run = '''
set -eu
for result in ${RESULTS:?job results required}; do
  case "$result" in
    success|skipped) ;;
    *) echo "::error::CI dependency result: $result"; exit 1 ;;
  esac
done
# Path detection must have run successfully, even when all areas are skipped.
test "${CHANGES_RESULT:?changes result required}" = success
'''

["ci:pnpm-store"]
description = "Expose the configured pnpm store to actions/cache"
run = 'echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"'

["ci:tauri-deps"]
description = "Install Tauri 2 Linux prerequisites on the Namespace runner"
run = '''
sudo apt-get update -qq
sudo apt-get install -y --no-install-recommends \
  libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
  build-essential curl wget file libxdo-dev libssl-dev \
  libayatana-appindicator3-dev librsvg2-dev
'''

["ci:playwright-deps"]
description = "Install Chromium system dependencies, including on browser cache hits"
dir = "{{config_root}}/apps/client"
run = "pnpm exec playwright install-deps chromium"

["ci:proto-drift"]
description = "Reject changed, deleted and newly generated untracked protobuf bindings"
run = '''
git diff --exit-code
test -z "$(git ls-files --others --exclude-standard -- services/api/gen)"
'''

["ci:proto-main"]
description = "Create the local main ref required by proto:breaking"
run = '''
git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
# Checkout may already be on the tested main commit for a push run.
if [ "$(git branch --show-current)" != main ]; then
  git branch --force main refs/remotes/origin/main
fi
'''

["ci:engine-archive"]
description = "Build engine test binaries once for reuse by the test job"
dir = "{{config_root}}/engine"
run = "cargo nextest archive --locked --workspace --archive-file nextest.tar.zst"

["ci:engine-test-archive"]
description = "Run the engine:test workspace suite from the precompiled nextest archive"
dir = "{{config_root}}/engine"
run = "cargo nextest run --archive-file nextest.tar.zst --workspace-remap ."
