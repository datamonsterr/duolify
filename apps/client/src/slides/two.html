<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      body {
        margin: 0;
        background: #161b43;
        color: white;
        font: 20px system-ui;
        display: grid;
        place-items: center;
        height: 100vh;
        text-align: center;
      }
      .star {
        font-size: 100px;
        color: #ffe68a;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-18px) rotate(15deg);
        }
      }
      p {
        color: #ccd4f7;
      }
      :root[data-motion="reduce"] *,
      :root[data-motion="reduce"] *::before,
      :root[data-motion="reduce"] *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
        scroll-behavior: auto !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          transform: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="star">✧</div>
      <h1>Meet the stars</h1>
      <p>Stars are distant suns, shining across space.</p>
    </main>
    <script>
      window.addEventListener("message", (e) => {
        if (e.source !== parent || !e.data || typeof e.data !== "object")
          return;
        if (
          e.data.type === "set_motion" &&
          typeof e.data.reduced === "boolean"
        ) {
          document.documentElement.dataset.motion = e.data.reduced
            ? "reduce"
            : "full";
          return;
        }
        const animations = document.getAnimations();
        if (e.data.type === "pause") animations.forEach((a) => a.pause());
        if (e.data.type === "play") animations.forEach((a) => a.play());
        if (e.data.type === "rate" && typeof e.data.rate === "number")
          animations.forEach((a) => (a.playbackRate = e.data.rate));
        if (e.data.type === "seek" && typeof e.data.time === "number")
          animations.forEach((a) => {
            a.currentTime = e.data.time;
            a.play();
          });
      });
    </script>
  </body>
</html>
