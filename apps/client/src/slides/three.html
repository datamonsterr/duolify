<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <style>
      body {
        margin: 0;
        background: #161b43;
        color: white;
        font: 20px system-ui;
        display: grid;
        place-items: center;
        height: 100vh;
        text-align: center;
      }
      .star {
        font-size: 100px;
        color: #ffe68a;
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-18px) rotate(15deg);
        }
      }
      p {
        color: #ccd4f7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="star">☾</div>
      <h1>Find your bearings</h1>
      <p>Notice how the sky changes as Earth turns.</p>
    </main>
    <script>
      window.addEventListener("message", (e) => {
        if (e.source !== parent) return;
        const animations = document.getAnimations();
        if (e.data.type === "pause") animations.forEach((a) => a.pause());
        if (e.data.type === "play") animations.forEach((a) => a.play());
        if (e.data.type === "seek" && typeof e.data.time === "number")
          animations.forEach((a) => {
            a.currentTime = e.data.time;
            a.play();
          });
      });
    </script>
  </body>
</html>
