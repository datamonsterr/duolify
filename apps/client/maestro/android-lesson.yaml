appId: app.duolify.client
androidWebViewHierarchy: devtools
---
- takeScreenshot: onboarding-dismissed
# The Courses page re-lays out while data and example cards load, so a tap aimed at
# "Start Product Management Foundations" can land on the header "Create a course" button
# (CI run 45375734211: the flow ended in the create chat). Redo the whole step from the
# tab bar until the example course page opens.
- retry:
    maxRetries: 3
    commands:
      - tapOn: Courses
      - scrollUntilVisible:
          element: Start Product Management Foundations
      - tapOn: Start Product Management Foundations
      - takeScreenshot: example-course
      - extendedWaitUntil:
          visible: Example course.*
          timeout: 15000
- scrollUntilVisible:
    element: Start lesson.*
- tapOn: Start lesson.*
- assertVisible: Slide 1 of.*
- takeScreenshot: lesson-portrait
- setOrientation: LANDSCAPE_LEFT
# Turning to landscape enters immersive mode (default on mobile): the framed header is gone.
- extendedWaitUntil:
    notVisible: Exit lesson
    timeout: 10000
- takeScreenshot: lesson-immersive-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Exit lesson
    timeout: 10000
# Autoplay may have moved to the next Slide while immersive.
- assertVisible: Slide \d+ of.*
