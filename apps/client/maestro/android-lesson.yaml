appId: app.duolify.client
androidWebViewHierarchy: devtools
---
- takeScreenshot: onboarding-dismissed
- tapOn: Courses
- takeScreenshot: courses
- scrollUntilVisible:
    element: Start Product Management Foundations
- tapOn: Start Product Management Foundations
- takeScreenshot: example-course
- scrollUntilVisible:
    element: Start lesson.*
- tapOn: Start lesson.*
- assertVisible: Slide 1 of.*
- takeScreenshot: lesson-portrait
- setOrientation: LANDSCAPE_LEFT
# Turning to landscape enters immersive mode (default on mobile): the framed header is gone.
- extendedWaitUntil:
    notVisible: Exit lesson
    timeout: 10000
- assertNotVisible: Slide 1 of.*
- takeScreenshot: lesson-immersive-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Exit lesson
    timeout: 10000
- assertVisible: Slide 1 of.*
