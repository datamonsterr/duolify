appId: app.duolify.client
androidWebViewHierarchy: devtools
---
# Continues from launch.yaml, which returns to the signed-out welcome screen.
# A second clearState relaunch can kill the new Android process when the old
# task is removed late (run 45419091676).
- assertVisible: Get started
- takeScreenshot: sign-in-welcome
- scrollUntilVisible:
    element: Get started
- tapOn: Get started
- takeScreenshot: sign-in-form
- scrollUntilVisible:
    element: Email address
- tapOn: Email address
- inputText: ${EMAIL}
- pressKey: Enter
- takeScreenshot: sign-in-email
- scrollUntilVisible:
    element: I am 16 or older
- tapOn: I am 16 or older
- takeScreenshot: sign-in-age
- scrollUntilVisible:
    element: Send code
- tapOn: Send code
- assertVisible: One-time code
- takeScreenshot: sign-in-code-requested
